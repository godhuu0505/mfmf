  <header class="border-b border-border bg-surface safe-px safe-pt">

  </header>
  <main class="mx-auto max-w-2xl space-y-5 px-4 py-6">
    <div><p class="text-sm text-muted-foreground">いつもの記録から、思い出したい日へ</p><h1 class="mt-1 text-2xl font-bold">日々の記録</h1></div>
    <section class="space-y-3 rounded-2xl bg-surface p-4 shadow-sm ring-1 ring-border" aria-labelledby="search-heading">
      <h2 id="search-heading" class="font-semibold">検索・絞り込み</h2>
      <label class="block"><span class="mb-1 block text-xs font-medium text-muted-foreground">思い出したいこと</span><input id="query" class="w-full rounded-lg border border-border bg-surface px-3 py-3 text-base" value="保育園から帰って、ゆっくりした日" maxlength="200"></label>

      <div class="rounded-xl bg-surface-muted p-3 text-xs leading-6 text-muted-foreground"><p><strong class="text-foreground">「関連度で探す」を押したときだけ</strong>、閲覧できる最近の記録を最大100件、Google Cloudへ送って並べ替えます。</p><p>写真・連絡先・URL・数値は送りません。本文の識別情報を除きますが、東京内での処理は保証されません。記録の保存先や共有範囲は変わりません。</p></div>
      <div class="flex flex-wrap gap-2 text-sm"><button type="button" class="rounded-full border border-border px-3 py-1.5">期間：最近3か月</button><button type="button" class="rounded-full border border-border px-3 py-1.5">記録元：すべて</button><button type="button" class="rounded-full border border-border px-3 py-1.5">タグ：すべて</button></div>
    </section>
    <section aria-live="polite"><p id="status" class="mb-3 text-sm text-muted-foreground">キーワードに完全一致しなくても、近い内容を探せます。</p><div id="results" class="space-y-3"></div></section>
    <section class="rounded-xl border border-border p-3"><label class="text-xs text-muted-foreground">確認する状態 <select id="state" class="ml-2 rounded border border-border bg-surface px-2 py-1"><option value="normal">候補あり</option><option value="empty">記録0件</option><option value="limit">上限に到達</option><option value="error">通信できない</option></select></label><p class="mt-2 text-xs leading-5 text-muted-foreground">このサンプルは通信も保存も行いません。入力と操作は画面内だけで完結します。</p></section>
  </main>
  <script>
    const records = [
      { date: '10月18日（日）', source: '保育園', text: 'たくさん遊んで帰宅。夕方は散歩を短めにし、静かな場所で丸くなって眠った。', label: '質問に近い記録' },
      { date: '10月16日（金）', source: 'おうち', text: '雨で室内遊び。おもちゃを追いかけたあと、ソファで昼寝をした。', label: 'あわせて確認' },
      { date: '10月21日（水）', source: 'サロン', text: 'サロンの帰りに公園を歩いた。帰宅後は食事をして、いつもどおり過ごした。', label: 'あわせて確認' },
    ];
    const status = document.getElementById('status');
    const results = document.getElementById('results');
    function render(related) {
      const state = document.getElementById('state').value;
      if (state !== 'normal') {
        const messages = { empty: 'この条件で確認できる記録はありません。期間や記録元を変えてください。', limit: '今日の関連度検索は上限に達しました。キーワード検索は引き続き使えます。', error: '関連度を確認できませんでした。時間をおいて試すか、キーワードで探してください。' };
        status.textContent = messages[state]; results.replaceChildren(); return;
      }
      status.textContent = related ? '最近の記録3件を、質問に近い順に表示しています。内容の正しさを判定するものではありません。' : 'キーワードに一致する記録を、新しい順に表示しています。';
      results.replaceChildren();
      (related ? records : records.slice().reverse()).forEach((record) => {
        const article = document.createElement('article'); article.className = 'rounded-2xl bg-surface p-4 shadow-sm ring-1 ring-border';
        const top = document.createElement('div'); top.className = 'flex items-center justify-between gap-2 text-xs text-muted-foreground';
        const date = document.createElement('span'); date.textContent = record.date;
        const source = document.createElement('span'); source.className = 'rounded-full bg-surface-muted px-2 py-1'; source.textContent = record.source;
        top.append(date, source); article.append(top);
        const text = document.createElement('p'); text.className = 'mt-3 text-sm leading-7'; text.textContent = record.text; article.append(text);
        if (related) { const label = document.createElement('p'); label.className = 'mt-3 text-xs text-primary'; label.textContent = record.label; article.append(label); }
        results.append(article);
      });
    }
    document.getElementById('related').addEventListener('click', () => render(true));
    document.getElementById('keyword').addEventListener('click', () => render(false));
    document.getElementById('state').addEventListener('change', () => render(true));
    render(false);
  </script>
</body>
</html>
