      <div class="grid gap-4 sm:grid-cols-2">
        <label class="block space-y-2 text-sm font-medium">ペット
          <select id="pet" class="block min-h-12 w-full rounded-xl border border-border bg-background px-3 text-base">
            <option value="mugi">むぎ</option><option value="sora">そら</option>
          </select>
        </label>
        <label class="block space-y-2 text-sm font-medium">記録の期間
          <select id="range" class="block min-h-12 w-full rounded-xl border border-border bg-background px-3 text-base">
            <option value="7">直近7日</option><option value="30">直近30日</option>
          </select>
        </label>
      </div>
      <p class="text-xs text-muted-foreground">予定は今日から7日先まで。日付は日本時間です。</p>
    </section>

    <article id="sheet" class="space-y-6" aria-live="polite" aria-atomic="true"></article>

    <div class="space-y-3 print:hidden">
      <button id="print" type="button" class="flex min-h-12 w-full items-center justify-center gap-2 rounded-xl bg-primary px-4 py-3 font-semibold text-primary-foreground hover:bg-primary-hover">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" class="h-5 w-5"><path d="M6 9V3h12v6M6 17H4a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v8H6zM17 12h2"/></svg>
        印刷・PDF保存
      </button>
      <p class="text-center text-xs leading-relaxed text-muted-foreground">端末の印刷画面が開きます。PDF保存の可否は端末によって異なります。</p>
    </div>

    <aside class="space-y-3 border-t border-border pt-4 print:hidden" aria-label="デモの状態切替">
      <p class="text-xs font-semibold text-muted-foreground">デモ設定（実際の記録は変更されません）</p>
      <div class="grid grid-cols-2 gap-3">
        <label class="space-y-1 text-xs text-muted-foreground">記録の件数
          <select id="state" class="block min-h-11 w-full rounded-lg border border-border bg-surface px-3 text-sm text-foreground"><option value="normal">通常</option><option value="empty">0件</option><option value="one">1件</option><option value="many">200件</option></select>
        </label>
        <label class="space-y-1 text-xs text-muted-foreground">表示テーマ
          <select id="theme" class="block min-h-11 w-full rounded-lg border border-border bg-surface px-3 text-sm text-foreground"><option value="system">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select>
        </label>
      </div>
    </aside>
    <footer class="border-t border-border pt-4 text-xs leading-relaxed text-muted-foreground">
      <p>このシートは入力された記録の整理です。診断や治療の指示を示すものではありません。</p>
      <p class="mt-1">mfmf · デモ用の架空データ · 作成日 2026年10月27日</p>
    </footer>
  </main>
  <script>
    const today = '2026-10-27';
    const pets = {mugi: {name:'むぎ', description:'犬 · トイプードル'}, sora: {name:'そら', description:'猫 · ミックス'}};
    const records = [
      {pet:'mugi', date:'2026-10-27', title:'朝ごはん', source:'おうち', body:'いつものごはんを完食。食後に水を飲みました。', status:'done', assignee:'みる人：あき'},
      {pet:'mugi', date:'2026-10-26', title:'お散歩と体重', source:'おうち', body:'夕方に20分お散歩。帰宅後に体重を測りました。', status:'done', weight:4.2, assignee:'みる人：はる'},
      {pet:'mugi', date:'2026-10-24', title:'保育園のようす', source:'保育園', body:'お友だちと遊び、午後はのんびり過ごしました。', status:'done', assignee:'送り：あき / お迎え：はる'},
      {pet:'mugi', date:'2026-10-22', title:'サロン', source:'サロン', body:'都合により見送り。次回は10月31日を予定しています。', status:'skipped', assignee:'担当未設定'},
      {pet:'mugi', date:'2026-10-10', title:'定期の体重記録', source:'おうち', body:'朝ごはんの前に測定しました。', status:'done', weight:4.1, assignee:'みる人：はる'},
      {pet:'mugi', date:'2026-10-29', title:'定期健診', source:'動物病院', body:'10:00予約。最近のごはんと体重の記録を持参。', status:'planned', assignee:'送り：あき'},
      {pet:'mugi', date:'2026-10-31', title:'トリミング', source:'サロン', body:'13:00予約。希望のスタイルを当日相談。', status:'planned', assignee:'送り：はる / お迎え：あき'},
      {pet:'sora', date:'2026-10-25', title:'朝のようす', source:'おうち', body:'窓辺で日向ぼっこ。朝ごはんを完食しました。', status:'done', weight:3.6, assignee:'みる人：あき'},
      {pet:'sora', date:'2026-10-30', title:'爪切り', source:'おうち', body:'夕方、様子を見ながら行う予定です。', status:'planned', assignee:'みる人：はる'}
    ];
    const byId = (id) => document.getElementById(id);
    const escape = (value) => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const date = value => {const [y,m,d]=value.split('-'); return `${Number(m)}月${Number(d)}日`;};
    const offset = days => {const d=new Date(today+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);};
    function item(row) {
      return `<li class="space-y-2 border-b border-border py-4 last:border-0 print:break-inside-avoid"><div class="flex flex-wrap items-baseline justify-between gap-2"><h3 class="font-medium">${escape(row.title)}</h3><span class="text-xs text-muted-foreground">${date(row.date)} · ${escape(row.source)}</span></div><p class="whitespace-pre-wrap break-words text-sm leading-relaxed">${escape(row.body)}</p><p class="text-xs text-muted-foreground">${escape(row.assignee)}</p></li>`;
    }
    function section(title, description, rows, empty) {
      return `<section class="rounded-2xl border border-border bg-surface px-4 py-4 print:rounded-none print:border-0 print:px-0"><div class="flex items-center justify-between gap-3"><h2 class="text-base font-semibold">${title}</h2><span class="rounded-full bg-surface-muted px-2 py-1 text-xs font-medium">${rows.length}件</span></div><p class="mt-1 text-xs text-muted-foreground">${description}</p>${rows.length ? `<ul class="mt-1">${rows.map(item).join('')}</ul>` : `<p class="py-5 text-sm text-muted-foreground">${empty}</p>`}</section>`;
    }
    function render() {
      const petId=byId('pet').value, pet=pets[petId], count=Number(byId('range').value), start=offset(1-count), end=offset(7), state=byId('state').value;
      let rows=records.filter(r=>r.pet===petId);
      if(state==='empty') rows=[];
      if(state==='one') rows=rows.filter(r=>r.status==='done').slice(0,1);
      if(state==='many') rows=Array.from({length:200},(_,i)=>({...records[0],pet:petId,date:offset(-(i%count)),title:`ごはんの記録 ${i+1}`}));
      const recent=rows.filter(r=>r.status==='done'&&r.date>=start&&r.date<=today).sort((a,b)=>b.date.localeCompare(a.date));
      const planned=rows.filter(r=>r.status==='planned'&&r.date>=today&&r.date<=end).sort((a,b)=>a.date.localeCompare(b.date));
      const skipped=rows.filter(r=>r.status==='skipped'&&r.date>=start&&r.date<=end);
      const latest=rows.filter(r=>r.status==='done'&&r.date<=today&&r.weight!=null).sort((a,b)=>b.date.localeCompare(a.date))[0];
      byId('sheet').innerHTML=`<section class="rounded-2xl border border-border bg-surface p-5 print:rounded-none print:p-4"><div class="flex flex-wrap items-start justify-between gap-4"><div><h2 class="text-2xl font-bold">${pet.name}</h2><p class="mt-1 text-sm text-muted-foreground">${pet.description}</p></div><div class="text-left sm:text-right"><p class="text-xs text-muted-foreground">最近の体重</p><p class="mt-1 text-xl font-semibold">${latest?`${latest.weight.toFixed(1)} <span class="text-sm font-normal">kg</span>`:'記録なし'}</p>${latest?`<p class="mt-1 text-xs text-muted-foreground">${date(latest.date)}の記録</p>`:''}</div></div><div class="mt-4 border-t border-border pt-3 text-xs leading-relaxed text-muted-foreground"><p>記録：${date(start)}〜${date(today)}（${count}日間）</p><p>予定：${date(today)}〜${date(end)}</p></div></section>`
        +section('これまでの記録','実施したこと・日々のようす',recent,'この期間の記録はありません。')
        +section('これからの予定','予定は実施済みの記録とは別に表示しています。',planned,'7日先までの予定はありません。')
        +section('見送った予定','実施済みには含めていません。',skipped,'この期間に見送った予定はありません。');
    }
    ['pet','range','state'].forEach(id=>byId(id).addEventListener('change',render));
    byId('theme').addEventListener('change',e=>{if(e.target.value==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=e.target.value;});
    byId('print').addEventListener('click',()=>window.print());
    render();
  </script>
</body>
</html>
