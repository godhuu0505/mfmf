<body class="min-h-screen bg-background text-foreground">
  <a class="skip-link" href="#main">本文へ移動</a>
  <div class="border-b border-border bg-surface-muted safe-px py-3">
    <div class="mx-auto max-w-2xl space-y-3">
      <p class="text-xs font-medium text-muted-foreground">画面確認用 · すべて架空データです。実際の接続や記録の変更は行いません。</p>
      <div class="grid grid-cols-2 gap-2 sm:grid-cols-3">
        <label class="space-y-1 text-xs text-muted-foreground">表示
          <select id="theme" class="min-h-10 w-full rounded-lg border border-border bg-surface px-2 text-sm text-foreground">
            <option value="system">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option>
          </select>
        </label>
        <label class="space-y-1 text-xs text-muted-foreground">接続先
          <select id="provider" class="min-h-10 w-full rounded-lg border border-border bg-surface px-2 text-sm text-foreground">
            <option>ChatGPT</option><option>Claude</option>
          </select>
        </label>
        <label class="col-span-2 space-y-1 text-xs text-muted-foreground sm:col-span-1">確認する状態
          <select id="scenario" class="min-h-10 w-full rounded-lg border border-border bg-surface px-2 text-sm text-foreground">
            <option value="normal">通常</option><option value="long">長い家族名</option><option value="no-household">所属する家族なし</option><option value="expired">申し込み期限切れ</option><option value="empty">接続0件</option><option value="duplicates">同じAIの接続2件</option>
          </select>
        </label>
      </div>
    </div>
  </div>
  <header class="border-b border-border bg-surface safe-px safe-pt">
    <div class="mx-auto flex max-w-2xl items-center justify-between gap-3 py-4">
      <button id="brand" type="button" class="flex min-h-11 items-center gap-2 font-bold text-primary" aria-label="接続確認画面へ">
        <span aria-hidden="true" class="text-xl">🐾</span><span class="text-xl tracking-tight">mfmf</span>
      </button>
      <span class="rounded-full bg-surface-muted px-3 py-1 text-xs font-medium text-muted-foreground">AIとの接続</span>
    </div>
  </header>
  <main id="main" class="mx-auto max-w-2xl px-4 pb-12 pt-5 sm:pt-8">
    <nav aria-label="確認する画面" class="mb-6 grid grid-cols-2 gap-1 rounded-xl border border-border bg-surface p-1">
      <button id="consent-tab" type="button" class="min-h-11 rounded-lg px-3 text-sm font-semibold" aria-current="page">接続の確認</button>
      <button id="connections-tab" type="button" class="min-h-11 rounded-lg px-3 text-sm font-semibold">接続の管理</button>
    </nav>
    <div id="screen"></div>
    <p id="announcement" role="status" aria-live="polite" class="mt-5 text-sm font-medium text-primary"></p>
    <footer class="mt-8 border-t border-border pt-4 text-xs leading-relaxed text-muted-foreground">架空の家族「こもれび家」「そよかぜ家」とペット「モモ」「ナギ」を使った、画面と操作の確認用です。</footer>
  </main>
  <script>
  (() => {
    'use strict';
    const screen = document.getElementById('screen');
    const announcement = document.getElementById('announcement');
    const roleLabels = { owner: '管理者', editor: '編集できるメンバー', viewer: '閲覧のみのメンバー' };
    const households = [
      { id: 'fictional-household-a', name: 'こもれび家', role: 'owner', pet: 'モモ', animal: 'いぬ' },
      { id: 'fictional-household-b', name: 'そよかぜ家', role: 'viewer', pet: 'ナギ', animal: 'ねこ' },
      { id: 'fictional-household-c', name: 'ひだまり家', role: 'editor', pet: 'コハル', animal: 'いぬ' },
    ];
    const initialConnections = () => [
      { id: 'fictional-connection-a', clientName: 'ChatGPT', householdId: households[0].id, createdAt: '2026年10月29日 20:15:10', expiresAt: '2026年11月28日 20:15:10' },
      { id: 'fictional-connection-b', clientName: 'Claude', householdId: households[1].id, createdAt: '2026年10月28日 19:30:24', expiresAt: '2026年11月27日 19:30:24' },
    ];
    let page = 'consent';
    let scenario = 'normal';
    let provider = 'ChatGPT';
    let selected = households[0].id;
    let connections = initialConnections();
    let completed = false;
    let denied = false;
    let added = 0;
    const escape = (value) => String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    const householdName = household => scenario === 'long' && household.id === households[0].id ? 'こもれびと、遠くで暮らす家族のみんなの記録' : household.name;
    function choosePage(next) {
      page = next;
      announcement.textContent = '';
      render();
      document.getElementById('page-title').focus();
    }
    function render() {
      for (const [id, active] of [['consent-tab', page === 'consent'], ['connections-tab', page === 'connections']]) {
        const button = document.getElementById(id);
        button.className = 'min-h-11 rounded-lg px-3 text-sm font-semibold ' + (active ? 'bg-primary text-primary-foreground' : 'text-muted-foreground hover:bg-surface-muted');
        if (active) button.setAttribute('aria-current', 'page'); else button.removeAttribute('aria-current');
      }
      if (page === 'connections') return renderConnections();
      if (completed) return renderComplete();
      if (denied) {
        screen.innerHTML = `<section class="space-y-4 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border sm:p-6"><h1 id="page-title" tabindex="-1" class="text-xl font-bold">接続を取り消しました</h1><p class="text-sm leading-relaxed text-muted-foreground">この申し込みでは、家族の記録はAIサービスへ渡りません。</p><button id="try-again" class="min-h-12 w-full rounded-xl border border-border px-4 text-sm font-semibold hover:bg-surface-muted">もう一度、画面を確認する</button></section>`;
        document.getElementById('try-again').onclick = () => { denied = false; render(); };
        return;
      }
      if (scenario === 'expired') {
        screen.innerHTML = `<section class="space-y-4 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border sm:p-6"><span class="inline-flex rounded-full bg-surface-muted px-3 py-1 text-xs font-medium text-muted-foreground">申し込みの期限が切れました</span><h1 id="page-title" tabindex="-1" class="text-xl font-bold">接続元から、もう一度お申し込みください</h1><p class="text-sm leading-relaxed text-muted-foreground">安全のため、接続の申し込みには有効期限があります。この画面からは許可できません。</p><button id="view-connections" class="min-h-12 w-full rounded-xl border border-border px-4 text-sm font-semibold hover:bg-surface-muted">現在の接続を確認する</button></section>`;
        document.getElementById('view-connections').onclick = () => choosePage('connections');
        return;
      }
      const available = scenario === 'no-household' ? [] : households;
      if (!available.length) {
        screen.innerHTML = `<section class="space-y-4 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border sm:p-6"><h1 id="page-title" tabindex="-1" class="text-xl font-bold">接続できる家族がありません</h1><p class="text-sm leading-relaxed text-muted-foreground">家族のメンバーとして参加してからお申し込みください。ゲストとしての閲覧権限は、AI接続には使えません。</p><button id="approve" disabled class="min-h-12 w-full rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground opacity-40">この家族の記録の閲覧を許可</button><button id="deny" class="min-h-12 w-full rounded-xl border border-border px-4 py-3 text-sm font-medium hover:bg-surface-muted">許可しない</button></section>`;
        document.getElementById('deny').onclick = () => { denied = true; render(); document.getElementById('page-title').focus(); };
        return;
      }
      const current = households.find(household => household.id === selected);
      screen.innerHTML = `
        <section class="space-y-6 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border sm:p-6">
          <div class="space-y-3"><span class="inline-flex rounded-full bg-surface-muted px-3 py-1 text-xs font-medium text-primary">閲覧のみ</span><h1 id="page-title" tabindex="-1" class="text-2xl font-bold leading-snug">${escape(provider)}に<br>家族の記録をつなぐ</h1><p class="text-sm leading-relaxed text-muted-foreground">許可した家族の記録を、${escape(provider)}から振り返れるようにします。</p></div>
          <div class="rounded-xl bg-surface-muted p-4"><p class="text-xs text-muted-foreground">ログイン中のアカウント</p><p class="mt-1 break-all text-sm font-medium">fictional@example.test</p></div>
          <fieldset class="space-y-3"><legend class="mb-1 text-sm font-semibold">どの家族の記録をつなぎますか？</legend>
            ${available.length ? available.map(household => `<label class="flex cursor-pointer items-start gap-3 rounded-xl border border-border p-4 has-checked:border-primary has-checked:bg-surface-muted"><input type="radio" name="household" value="${household.id}" ${household.id === selected ? 'checked' : ''} class="mt-1 h-4 w-4 shrink-0 accent-primary"><span class="min-w-0"><span class="block break-words text-sm font-semibold">${escape(householdName(household))}</span><span class="mt-1 block text-xs leading-relaxed text-muted-foreground">${escape(household.pet)}（${household.animal}） · ${roleLabels[household.role]}</span></span></label>`).join('') : `<div class="rounded-xl border border-border bg-surface-muted p-4"><p class="text-sm font-semibold">接続できる家族がありません</p><p class="mt-2 text-sm leading-relaxed text-muted-foreground">家族のメンバーとして参加してからお申し込みください。ゲストとしての閲覧権限は、AI接続には使えません。</p></div>`}
          </fieldset>
          <section class="space-y-3 border-t border-border pt-5" aria-labelledby="scope-title"><h2 id="scope-title" class="text-sm font-semibold">AIへ渡る情報</h2><ul class="list-disc space-y-2 pl-5 text-sm leading-relaxed"><li>選んだ家族の、保存済みの記録の日付・本文・記録の種類・入力済みの体重</li><li>その家族のペットの名前など、記録を読むための基本情報</li></ul><p class="text-xs leading-relaxed text-muted-foreground">家族が書いた記録も含みます。記録の本文に個人情報が書かれている場合、その内容がAIへ渡ることがあります。</p><details class="rounded-xl border border-border p-4"><summary class="cursor-pointer text-sm font-medium">AIへ渡る記録の例を見る</summary><div class="mt-3 space-y-2 text-sm leading-relaxed"><p class="text-xs text-muted-foreground">2026年10月28日 · 保存済み · 架空の記録</p><p id="preview-title" class="font-semibold">${escape(current.pet)}のおうちでの様子</p><p>ごはんを食べてから、いつものおもちゃで遊びました。午後は窓辺でのんびり。</p></div></details></section>
          <div class="space-y-2 rounded-xl bg-surface-muted p-4 text-sm leading-relaxed"><p class="font-semibold">写真や動画は渡しません</p><p class="text-muted-foreground">写真・動画の本体や閲覧用リンク、メンバー一覧・メールアドレスなどの会員情報は対象外です。下書きと削除済みの記録も含みません。</p><p class="pt-1 text-muted-foreground">記録の追加・変更・削除、家族への招待はできません。</p></div>
          <div class="space-y-2 text-sm leading-relaxed text-muted-foreground"><p>接続の有効期限は<strong class="text-foreground">最長30日</strong>。いつでも「AIとの接続」から解除できます。</p><p>許可した内容は${escape(provider)}へ送られ、そのサービスのデータの扱いに従います。</p><p>この接続先の家族は固定です。mfmfで表示する家族を切り替えても変わりません。</p></div>
          <div class="space-y-3 border-t border-border pt-5"><p id="selected-household" class="break-words text-sm font-medium">${available.length ? escape(householdName(current)) + 'の記録をつなぎます' : '家族への参加が必要です'}</p><button id="approve" ${available.length ? '' : 'disabled'} class="min-h-12 w-full rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground transition hover:bg-primary-hover disabled:cursor-not-allowed disabled:opacity-40">この家族の記録の閲覧を許可</button><button id="deny" class="min-h-12 w-full rounded-xl border border-border px-4 py-3 text-sm font-medium hover:bg-surface-muted">許可しない</button></div>
        </section>`;
      for (const input of screen.querySelectorAll('input[name="household"]')) input.onchange = event => {
        selected = event.target.value;
        const household = households.find(household => household.id === selected);
        document.getElementById('selected-household').textContent = householdName(household) + 'の記録をつなぎます';
        document.getElementById('preview-title').textContent = household.pet + 'のおうちでの様子';
      };
      document.getElementById('approve').onclick = () => {
        if (!available.length) return;
        connections.unshift({ id: 'fictional-added-' + (++added), clientName: provider, householdId: selected, createdAt: '2026年10月29日 21:05:32', expiresAt: '2026年11月28日 21:05:32' });
        completed = true; render(); document.getElementById('page-title').focus();
      };
      document.getElementById('deny').onclick = () => { denied = true; render(); document.getElementById('page-title').focus(); };
    }
    function renderComplete() {
      const household = households.find(household => household.id === selected);
      screen.innerHTML = `<section class="space-y-5 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border sm:p-6"><span class="inline-flex rounded-full bg-surface-muted px-3 py-1 text-xs font-medium text-primary">操作イメージ</span><h1 id="page-title" tabindex="-1" class="text-xl font-bold">${escape(provider)}と接続できました</h1><p class="break-words text-sm leading-relaxed"><strong>${escape(householdName(household))}</strong>の保存済みの記録を、${escape(provider)}から振り返れるようになります。</p><div class="rounded-xl bg-surface-muted p-4 text-sm leading-relaxed text-muted-foreground">画面確認用のため、実際には接続していません。記録の送信も行っていません。</div><button id="manage" class="min-h-12 w-full rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-primary-foreground hover:bg-primary-hover">接続の管理へ</button><button id="another" class="min-h-12 w-full rounded-xl border border-border px-4 py-3 text-sm font-medium hover:bg-surface-muted">別の家族の接続を確認する</button></section>`;
      document.getElementById('manage').onclick = () => choosePage('connections');
      document.getElementById('another').onclick = () => { completed = false; choosePage('consent'); };
    }
    function renderConnections() {
      screen.innerHTML = `<div class="space-y-5"><div class="space-y-2"><h1 id="page-title" tabindex="-1" class="text-xl font-bold">AIとの接続</h1><p class="text-sm leading-relaxed text-muted-foreground">あなたが許可した接続です。接続先の家族と有効期限を確認できます。</p></div><div class="rounded-xl border border-border bg-surface p-4 text-sm leading-relaxed text-muted-foreground">解除すると、新たな閲覧を停止します。AIサービスがすでに受け取った内容は削除されません。接続先のサービスでも確認してください。</div><div id="connection-list" class="space-y-4">${connections.length ? connections.map(connection => {
        const household = households.find(household => household.id === connection.householdId);
        return `<article class="space-y-4 rounded-2xl bg-surface p-5 shadow-sm ring-1 ring-border"><div class="flex items-start justify-between gap-3"><h2 class="text-lg font-bold">${escape(connection.clientName)}</h2><span class="shrink-0 rounded-full bg-surface-muted px-2 py-1 text-xs font-medium text-primary">閲覧のみ</span></div><div><p class="text-xs text-muted-foreground">接続先の家族</p><p class="mt-1 break-words text-sm font-semibold">${escape(householdName(household))}</p></div><dl class="space-y-2 text-xs text-muted-foreground"><div class="flex flex-wrap justify-between gap-x-3 gap-y-1"><dt>接続した日時</dt><dd class="text-foreground">${connection.createdAt}</dd></div><div class="flex flex-wrap justify-between gap-x-3 gap-y-1"><dt>有効期限</dt><dd class="text-foreground">${connection.expiresAt}</dd></div></dl><button data-revoke="${connection.id}" aria-label="${escape(connection.clientName)}・${escape(householdName(household))}・${connection.createdAt}の接続を解除" class="min-h-11 w-full rounded-xl border border-border px-4 py-2 text-sm font-medium text-red-700 hover:bg-surface-muted dark:text-red-300">接続を解除</button></article>`;
      }).join('') : `<section class="space-y-3 rounded-2xl border border-dashed border-border bg-surface p-6 text-center"><h2 class="text-base font-semibold">接続中のAIサービスはありません</h2><p class="text-sm leading-relaxed text-muted-foreground">使いたいサービスから接続を申し込むと、ここで確認できます。</p></section>`}</div><button id="new-connection" class="min-h-12 w-full rounded-xl border border-border bg-surface px-4 py-3 text-sm font-medium hover:bg-surface-muted">接続確認の画面をもう一度見る</button></div>`;
      for (const button of screen.querySelectorAll('[data-revoke]')) button.onclick = () => {
        const connection = connections.find(connection => connection.id === button.dataset.revoke);
        connections = connections.filter(item => item.id !== connection.id);
        renderConnections();
        announcement.textContent = connection.clientName + '・' + householdName(households.find(household => household.id === connection.householdId)) + 'との接続を解除しました（確認用）。';
        document.getElementById('page-title').focus();
      };
      document.getElementById('new-connection').onclick = () => { completed = false; denied = false; choosePage('consent'); };
    }
    document.getElementById('theme').onchange = event => {
      if (event.target.value === 'system') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = event.target.value;
    };
    document.getElementById('provider').onchange = event => { provider = event.target.value; completed = false; denied = false; render(); };
    document.getElementById('scenario').onchange = event => {
      scenario = event.target.value; completed = false; denied = false;
      connections = scenario === 'empty' ? [] : initialConnections();
      if (scenario === 'duplicates') connections[1] = { ...connections[1], clientName: 'ChatGPT', createdAt: '2026年10月29日 20:17:42' };
      if (scenario === 'empty' || scenario === 'duplicates') page = 'connections';
      render(); announcement.textContent = '';
    };
    document.getElementById('consent-tab').onclick = () => { completed = false; denied = false; choosePage('consent'); };
    document.getElementById('connections-tab').onclick = () => choosePage('connections');
    document.getElementById('brand').onclick = () => { completed = false; denied = false; choosePage('consent'); };
    render();
  })();
  </script>
</body>
</html>
