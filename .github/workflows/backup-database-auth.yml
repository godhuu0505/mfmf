name: Back up database and Auth

# Preservation only: a single public + auth snapshot, encrypted before disk.
on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize with production migrations; application writes are NOT frozen.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backup:
    if: github.repository == 'godhuu0505/mfmf' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test exporter without credentials or network
        run: node --test tests/scripts/backup-database-auth.test.mjs
      - name: Configure bounded package downloads
        uses: ./.github/actions/configure-apt
      - name: Install PostgreSQL 17 client and encryption
        timeout-minutes: 5
        # Ubuntu's default repository has PostgreSQL 16. Configure the official
        # signed PGDG repository explicitly; verify its signing-key fingerprint.
        # Pin major 17 and accept its security patch updates.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          curl --fail --location --retry 2 --max-time 60 https://www.postgresql.org/media/keys/ACCC4CF8.asc -o "$RUNNER_TEMP/pgdg.asc"
          test "$(gpg --batch --show-keys --with-colons "$RUNNER_TEMP/pgdg.asc" | awk -F: '$1=="fpr" {print $10; exit}')" = B97B0AFCAA1A47F044F244A07FCC7D46ACCC4CF8
          sudo install -m 0644 "$RUNNER_TEMP/pgdg.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17 age
      - name: Encrypt one consistent public and Auth archive
        timeout-minutes: 22
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_BACKUP_AGE_RECIPIENT: ${{ vars.SUPABASE_BACKUP_AGE_RECIPIENT }}
        run: node scripts/gcp/backup-database-auth.mjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: database-auth-backup-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/database-auth-backup-encrypted/database-auth.pgdump.age
          retention-days: 90
          if-no-files-found: error
      - name: Remove runner ciphertext
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/database-auth-backup-encrypted"
