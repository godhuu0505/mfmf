name: CI

# lint / typecheck / unit test / build の検証ゲート。
# Claude Code のローカルゲート（just check = npm run lint / typecheck / test:unit / build）と同一。
# - PR では単独で走る。
# - main への push 時はデプロイワークフロー（deploy-production.yml）から workflow_call で再利用し、
#   この検証が緑のときだけ migration 適用 + Vercel Production デプロイする（ゲート）。
on:
  pull_request:
  workflow_call:

# 同一 PR / ブランチの古い実行はキャンセルして無駄を省く
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # tests/unit/（Vitest, D30）。純粋関数の入力変換・境界値をここで守る。
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        # NEXT_PUBLIC_* はブラウザ公開前提の値。ビルド通過用のプレースホルダで十分
        # （秘密情報ではない / service_role key は使わない）。
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build

  # Supabase ローカルスタックを起動し、migration 適用後に pgTAP で RLS のテナント分離を検証する。
  # RLS（一次防衛線）を弱める変更が入るとここで赤くなり PR が落ちる（Issue #38 / #92 手順5）。
  # workflow_call（deploy 系から再利用）でも走らせ、main マージ前にも分離を担保する。
  # 続けて Integration テスト（tests/integration/ / D30）も同じスタックで実行する
  # —— 起動コストを二重に払わないための相乗り。pgTAP が「DB が守っているか」、
  # Integration が「Server Action がどの世帯を基準に認可したか」を見る。
  db-rls-tests:
    name: RLS tenant isolation (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # deploy-production.yml と同じ supabase/setup-cli@v2 を使う。
      - uses: supabase/setup-cli@v2
        with:
          # version: latest にすると起動のたびに GitHub API で最新 release を解決し、
          # ランナー共有 IP の匿名レートリミットに当たって CI が落ちることがある
          # （認証トークンはアクション側が自前の env で上書きするため渡せない）。
          # バージョンは固定し、上げるときはここを書き換える。
          version: 2.111.0

      # supabase start でローカルスタックを起動し、supabase/migrations/*.sql を順に適用する。
      - name: Start Supabase (apply migrations)
        run: supabase start

      # supabase/tests/**/*.sql を pg_prove で実行。1 つでも失敗すれば exit≠0 でジョブが落ちる。
      - name: Run pgTAP tests
        run: supabase test db

      # ローカルスタックの anon key（ブラウザ公開前提の値。秘密情報ではない）
      - name: Export local Supabase env
        run: |
          ANON_KEY=$(supabase status -o env | awk -F= '/^ANON_KEY=/{print $2}' | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"

      - name: Run integration tests (Server Action 認可)
        run: npm run test:integration

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # System 層（D25 の E2E + D31 の VRT）: ローカル Supabase ＋ next start に対して
  # Playwright を実行する。pgTAP（db-rls-tests）とは別ジョブ（DB だけでなくアプリ本体を
  # 起動するため）。VRT ベースラインは Linux + Noto CJK + lock で固定した chromium で
  # 生成されており、このジョブが同一条件で比較する。
  e2e:
    name: E2E + VRT (Playwright)
    runs-on: ubuntu-latest
    # 権限は既定（contents: read）のまま。キャプチャのコミットは別ワークフロー
    # （screenshots.yml / workflow_run）が行う —— この workflow は
    # deploy-production.yml から workflow_call で再利用され、呼び出し側より
    # 強い権限を要求すると run が起動できなくなるため。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          # version: latest にすると起動のたびに GitHub API で最新 release を解決し、
          # ランナー共有 IP の匿名レートリミットに当たって CI が落ちることがある
          # （認証トークンはアクション側が自前の env で上書きするため渡せない）。
          # バージョンは固定し、上げるときはここを書き換える。
          version: 2.111.0

      - name: Start Supabase (apply migrations)
        run: supabase start

      # ローカルスタックの anon key（ブラウザ公開前提の値。秘密情報ではない）を後続へ渡す
      - name: Export local Supabase env
        run: |
          ANON_KEY=$(supabase status -o env | awk -F= '/^ANON_KEY=/{print $2}' | tr -d '"')
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"

      # VRT のフォントをベースライン生成環境と揃える（D31）
      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright tests
        env:
          TOKEN_ENC_KEY: e2e-local-dummy
        run: npm run test:e2e

      # 失敗テストの aria スナップショットをログに直接出す（アーティファクトの
      # 実体ホストへ到達できない環境からでも一次調査できるように）
      - name: Print error contexts
        if: failure()
        run: |
          find test-results -name "error-context.md" -print0 | while IFS= read -r -d '' f; do
            echo "===== $f ====="
            cat "$f"
          done

      # 失敗時の一次情報（トレース・VRT の actual/diff 画像）
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # 成功時も UI キャプチャ（zz-screenshots.spec.ts の出力）だけは残す。
      # UI 変更 PR はここから取得してブランチにコミットし、PR に貼る（CLAUDE.md「Git / PR」）。
      - name: Upload UI screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: test-results/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  # PR で追加 / 変更された supabase/migrations/*.sql に破壊的 SQL が含まれていないかを検査する。
  # Free プランには自動バックアップが無く、destructive 変更は事実上戻せないため、
  # PR 段階で気づけるようにする。warning 止まりで強制ブロックはしない（やむを得ない場合がある）。
  # workflow_call で deploy 系から呼ばれた時は PR コンテキストでないので skip される。
  check-destructive-migration:
    name: Check destructive migration SQL
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect destructive SQL in changed migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          FILES=$(git diff --name-only --diff-filter=AM "$BASE_SHA" "$HEAD_SHA" -- 'supabase/migrations/*.sql' || true)
          if [ -z "$FILES" ]; then
            echo "No migration changes in this PR."
            exit 0
          fi
          echo "Changed migrations:"
          echo "$FILES"
          # 検出対象:
          #   - DROP TABLE / DROP COLUMN / DROP TYPE   … 構造とデータ消失
          #   - ALTER ... TYPE                          … 型変換失敗 / 暗黙の切り捨て
          #   - TRUNCATE / DELETE FROM                  … 行消失
          #   - RENAME COLUMN / RENAME TO               … アプリ参照の不整合（データは残るが表示できなくなる）
          #   - SET NOT NULL                            … 既存 NULL 行で migration が停止 or 既定値が必要
          # 検出対象外（メタオブジェクトでデータに影響しない）:
          #   - DROP POLICY / DROP TRIGGER / DROP CONSTRAINT
          PATTERN='drop[[:space:]]+table|drop[[:space:]]+column|drop[[:space:]]+type|alter[[:space:]]+table[[:space:]]+[^ ]+[[:space:]]+drop[[:space:]]+column|alter[[:space:]]+column[[:space:]]+[^ ]+[[:space:]]+(set[[:space:]]+data[[:space:]]+)?type|alter[[:space:]]+table[[:space:]]+[^ ]+[[:space:]]+rename|rename[[:space:]]+column|rename[[:space:]]+to|set[[:space:]]+not[[:space:]]+null|truncate|delete[[:space:]]+from'
          # 「ファイル名:行番号:<空白>--」で始まる行（SQL の行コメント）を除外する。
          # 行末コメントは検出されるが、コード本体が引っかかっているので妥当。
          MATCHES=$(echo "$FILES" | xargs grep -niE "$PATTERN" 2>/dev/null | grep -vE ':[[:space:]]*--' || true)
          if [ -n "$MATCHES" ]; then
            echo "::warning::Destructive SQL detected. Confirm: (1) ローカル supabase db reset で動作確認済み, (2) Artifact から復旧可能, (3) Storage / auth.users を触らない or 別途バックアップ済み. 詳細は docs/guides/deploy.md."
            echo "$MATCHES"
          else
            echo "No destructive SQL detected."
          fi
