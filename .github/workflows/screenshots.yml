name: Commit UI screenshots

# CI（E2E）が緑になった PR の UI キャプチャを screenshots/<headブランチ> へコミットする。
#
# CI 本体ではなく workflow_run で行う理由:
#   ci.yml は deploy-production.yml から workflow_call で再利用される。再利用される
#   workflow が呼び出し側（contents: read）より強い権限を要求すると、main への push で
#   run 自体が起動できない（startup_failure = 本番デプロイが動かない）。
#   キャプチャのコミットに必要な contents: write はこちらに分離して持たせる。
#
# 注意: workflow_run は「デフォルトブランチにあるこのファイル」が使われる。
# PR ブランチでこのファイルを直しても、main にマージされるまで挙動は変わらない。
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  commit:
    name: Commit screenshots
    # 同一リポジトリの PR で CI が成功したときだけ
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      # CI が成功時に残す ui-screenshots（zz-screenshots.spec.ts の出力）。
      # UI キャプチャが無い run もあるので、取得できなくても失敗にしない。
      - name: Download UI screenshots
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ui-screenshots
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ui-screenshots

      - name: Commit to screenshots branch
        if: steps.download.outcome == 'success'
        env:
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "$(ls -A ui-screenshots 2>/dev/null || true)" ]; then
            echo "キャプチャなし"
            exit 0
          fi
          # UI に触れない PR ではキャプチャを積まない（動的データで毎回変わるため、
          # 内容差分では判定できない）。base は default branch との merge-base。
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          BASE_SHA=$(git merge-base FETCH_HEAD HEAD)
          if ! git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(src/|public/)'; then
            echo "UI に触れない PR のためスキップ"
            exit 0
          fi
          SHOT_BRANCH="screenshots/$HEAD_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 既存の screenshots ブランチがあればその続きに積む
          if git fetch --no-tags origin "refs/heads/$SHOT_BRANCH"; then
            git checkout -B screenshots-work FETCH_HEAD
          else
            git checkout -B screenshots-work "$HEAD_SHA"
          fi
          # 改名・削除されたキャプチャが残らないよう、作り直してから今回の分を置く
          rm -rf docs/screenshots/app-redesign
          mkdir -p docs/screenshots/app-redesign
          cp ui-screenshots/*.png docs/screenshots/app-redesign/
          git add -A docs/screenshots/app-redesign
          if git diff --cached --quiet; then
            echo "キャプチャに変化なし"
            exit 0
          fi
          git commit -m "docs: UI キャプチャを更新（CI zz-screenshots / $HEAD_SHA）"
          git push origin "HEAD:refs/heads/$SHOT_BRANCH"
