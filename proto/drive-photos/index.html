<div class="min-h-dvh bg-background text-foreground">
  <!-- ============ 案の切り替え（常時表示） ============ -->
  <div class="safe-pt sticky top-0 z-30 border-b border-border bg-background/95 backdrop-blur">
    <div class="mx-auto max-w-md px-4 py-2">
      <div class="mb-1.5 flex items-baseline justify-between">
        <span class="text-xs font-medium text-muted-foreground">保存パターン</span>
        <button
          type="button"
          data-open-settings
          class="rounded-md px-2 py-0.5 text-xs font-medium text-primary transition hover:bg-surface-muted"

          プロト設定

        <button type="button" data-plan="A" class="rounded-md px-2 py-1.5 text-xs font-medium transition">
          A バックアップ
        </button>
        <button type="button" data-plan="B" class="rounded-md px-2 py-1.5 text-xs font-medium transition">
          B 引っ越し

  <!-- ============ 画面 ============ -->
  <main class="mx-auto max-w-md px-4 pt-4 pb-32" data-screen></main>

  <!-- ============ ボトムタブバー（D33 の 5 スロット） ============ -->

    class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-surface/95 backdrop-blur"

    <div

      <button type="button" data-screen-to="album" class="flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition">

      </button>

<script>
  // ---------------------------------------------------------------
  // プロトの状態（すべて固定データ。fetch は書かない）
  // ---------------------------------------------------------------
  const state = {
    plan: "A", // A: バックアップ / B: 引っ越し / C: 毎回選ぶ
    photo: "both", // both / appOnly / driveOnly / none
    link: "linked", // linked / none / expired
    role: "editor", // editor / viewer
    owner: "each", // each: 各自の Drive / owner: owner に集約
    screen: "detail",
  };

  const PLAN = {
    A: {
      name: "案 A: バックアップ型",
      tagline: "アプリが正・ドライブは控え。表示は常にアプリ側なのでドライブ通信は保存時だけ。",
    },
    B: {
      name: "案 B: 引っ越し型",
      tagline: "原本はドライブ・サムネだけアプリ。一覧は 0 通信、原本を開いたときだけドライブへ。",
    },
    C: {
      name: "案 C: 毎回選ぶ型",
      tagline: "保存のたびに保存先を選ぶ。自由だが写真ごとに状態がばらつき、一覧でドライブ通信が要る。",
    },
  };

  const TOGGLES = [
    {
      key: "photo",
      label: "写真の在りか",
      options: [
        ["both", "両方にある"],
        ["appOnly", "アプリだけ"],
        ["driveOnly", "ドライブだけ"],
        ["none", "どちらにも無い"],
      ],
    },
    {
      key: "link",
      label: "ドライブ連携",
      options: [
        ["linked", "連携済み"],
        ["none", "未連携"],
        ["expired", "失効（要再同意）"],
      ],
    },
    {
      key: "role",
      label: "権限",
      options: [
        ["editor", "owner / editor"],
        ["viewer", "viewer"],
      ],
    },
    {
      key: "owner",
      label: "原本の持ち主",
      options: [
        ["each", "各自のドライブ"],
        ["owner", "owner に集約"],
      ],
    },
  ];

  // アルバムのモック（24 枚。ばらつきを出すため在りかを散らす）
  const ALBUM = Array.from({ length: 24 }, (_, i) => ({
    emoji: ["🐕", "🦴", "🐾", "🍚", "🌳", "🛁"][i % 6],
    where: i % 7 === 3 ? "appOnly" : i % 5 === 0 ? "driveOnly" : "both",
  }));

  // ---------------------------------------------------------------
  // 表示ヘルパー
  // ---------------------------------------------------------------
  const on = "bg-primary text-primary-foreground";
  const off = "text-muted-foreground hover:bg-surface-muted";

  function photoBox(emoji, extra = "") {
    return `<div class="flex aspect-square items-center justify-center rounded-lg bg-surface-muted text-3xl ${extra}">${emoji}</div>`;
  }

  function badge(text, tone = "muted") {
    const cls =
      tone === "primary"
        ? "border-primary/40 text-primary"
        : tone === "warn"
          ? "border-amber-500/50 text-amber-700 dark:text-amber-400"
          : "border-border text-muted-foreground";
    return `<span class="inline-flex items-center gap-1 rounded-full border ${cls} px-2 py-0.5 text-[11px] font-medium">${text}</span>`;
  }

  function card(inner, extra = "") {
    return `<section class="rounded-xl border border-border bg-surface p-4 ${extra}">${inner}</section>`;
  }

  function note(text) {
    return `<p class="mt-2 text-xs leading-relaxed text-muted-foreground">${text}</p>`;
  }

  // 「この画面で発生するドライブ通信」の見積り（レートリミット検討用）
  function driveCalls(screen) {
    if (state.link !== "linked") return 0;
    if (screen === "album") {
      if (state.plan === "A" || state.plan === "B") return 0;
      return ALBUM.filter((p) => p.where === "driveOnly").length; // 案 C は原本しか無い写真を都度取得
    }
    if (screen === "detail") {
      if (state.plan === "A") return 0;
      if (state.plan === "B") return 0; // サムネ表示のみ。原本を開くと +1
      return state.photo === "driveOnly" ? 1 : 0;
    }
    return 0;
  }

  function meter(screen) {
    const n = driveCalls(screen);
    const units = n * 200;
    const tone = n === 0 ? "border-border" : "border-amber-500/50";
    return `
      <div class="mt-4 rounded-lg border ${tone} bg-surface-muted/60 px-3 py-2">
        <p class="text-xs font-medium text-foreground">この画面で発生するドライブ通信: ${n} 回<span class="ml-1 font-normal text-muted-foreground">（${units.toLocaleString()} quota units）</span></p>
        <p class="mt-1 text-[11px] leading-relaxed text-muted-foreground">
          上限はユーザーあたり 325,000 units/分・プロジェクト全体で 1,000,000 units/分。
          ダウンロード 1 回 = 200 units なので、<strong class="font-medium text-foreground">一覧をドライブから描かない限り上限には当たらない</strong>。
          効くのは Vercel の関数実行と帯域の方。
        </p>
      </div>`;
  }

  // ---------------------------------------------------------------
  // 画面: 記録詳細（写真 1 枚の状態表示が主役）
  // ---------------------------------------------------------------
  function screenDetail() {
    const driveOwner =
      state.owner === "owner" ? "はなこさん（世帯 owner）のドライブ" : "たろうさんのドライブ";

    let photoArea = "";

    // --- どちらにも無い（全案共通の異常系） ---
    if (state.photo === "none") {
      photoArea = `
        <div class="flex aspect-square flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-border bg-surface-muted/50 p-4 text-center">
          <span class="text-3xl">🔍</span>
          <p class="text-sm font-medium text-foreground">この写真を表示できません</p>
          <p class="text-xs leading-relaxed text-muted-foreground">mfmf が写真を削除することはありません。<br />ドライブのゴミ箱に残っていることが多いです。</p>
        </div>
        <div class="mt-3 space-y-2">
          <button type="button" class="w-full rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">ドライブのゴミ箱を開く</button>
          ${
            state.link === "expired"
              ? `<button type="button" class="w-full rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">ドライブに再連携する</button>`
              : ""
          }
          ${
            state.role === "editor"
              ? `<button type="button" class="w-full rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">端末の写真から入れ直す</button>`
              : ""
          }
        </div>`;
    }

    // --- 案 A: アプリが正 ---
    else if (state.plan === "A") {
      if (state.photo === "driveOnly") {
        photoArea = `
          <div class="flex aspect-square flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-border bg-surface-muted/50 p-4 text-center">
            <span class="text-3xl">🚧</span>
            <p class="text-sm font-medium text-foreground">案 A ではこの状態は起きません</p>
            <p class="text-xs leading-relaxed text-muted-foreground">アプリ側の原本を消さない設計だからです。<br />（消す設計にした瞬間、案 A は案 B になります）</p>
          </div>`;
      } else {
        const synced = state.photo === "both";
        photoArea = `
          ${photoBox("🐕")}
          <div class="mt-2 flex flex-wrap items-center gap-2">
            ${
              state.link !== "linked"
                ? badge("アプリに保存済み")
                : synced
                  ? badge("☁︎ ドライブにバックアップ済み")
                  : badge("⏳ バックアップ待ち", "warn")
            }
            ${synced && state.link === "linked" ? `<span class="text-[11px] text-muted-foreground">${driveOwner}</span>` : ""}
          </div>
          ${
            !synced && state.link === "linked" && state.role === "editor"
              ? `<button type="button" class="mt-3 w-full rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">今すぐバックアップする</button>`
              : ""
          }
          ${
            state.link === "none"
              ? note("ドライブ未連携。写真はアプリ内にだけあります。連携すると自動で控えが作られます。")
              : ""
          }`;
      }
    }

    // --- 案 B: ドライブが正・サムネだけアプリ ---
    else if (state.plan === "B") {
      if (state.photo === "appOnly") {
        photoArea = `
          ${photoBox("🐕")}
          <div class="mt-2 flex flex-wrap items-center gap-2">${badge("原本: アプリ内")}</div>
          ${note("未連携のメンバーやゲストが入れた写真はアプリに原本が残ります。ここは案 B でも正常な状態です。")}
          ${
            state.link === "linked" && state.role === "editor"
              ? `<button type="button" class="mt-3 w-full rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">原本をドライブへ移す</button>`
              : ""
          }`;
      } else if (state.photo === "driveOnly") {
        photoArea = `
          <div class="flex aspect-square items-center justify-center rounded-lg bg-surface-muted text-3xl">🐕</div>
          <div class="mt-2 flex flex-wrap items-center gap-2">${badge("サムネイル未生成", "warn")}</div>
          ${note("サムネが作られる前にアプリ側が消えた稀な状態。原本をプロキシ経由で縮小して出すため、この 1 枚だけドライブ通信が起きます。")}`;
      } else {
        photoArea = `
          ${photoBox("🐕")}
          <div class="mt-2 flex flex-wrap items-center gap-2">
            ${badge("原本: Google ドライブ", "primary")}
            <span class="text-[11px] text-muted-foreground">${driveOwner}</span>
          </div>
          <button type="button" class="mt-3 w-full rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">原本を表示（+1 通信）</button>
          ${note("一覧・詳細で見えているのはアプリ内のサムネ（長辺 1600px）。ドライブを叩くのは原本を開いたときだけです。")}`;
      }
    }

    // --- 案 C: 写真ごとに保存先が違う ---
    else {
      const where =
        state.photo === "both" ? "アプリ＋ドライブ" : state.photo === "appOnly" ? "アプリのみ" : "ドライブのみ";
      photoArea = `
        ${photoBox("🐕")}
        <div class="mt-2 flex flex-wrap items-center gap-2">
          ${badge(`保存先: ${where}`, state.photo === "driveOnly" ? "primary" : "muted")}
          ${state.photo === "driveOnly" ? `<span class="text-[11px] text-muted-foreground">${driveOwner}</span>` : ""}
        </div>
        ${
          state.photo === "driveOnly"
            ? note("この写真はアプリ側に実体が無いので、詳細を開くたびにドライブから取得します。連携が切れると即座に見えなくなります。")
            : note("写真ごとに保存先が違うため、家族の誰がどこに入れたかで見え方が変わります。")
        }`;
    }

    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">2026年8月4日（火）</h1>
      <p class="mb-4 text-sm text-muted-foreground">保育園 ・ 記入: たろう</p>
      ${card(photoArea)}
      ${card(
        `<p class="text-sm leading-relaxed text-foreground">今日はお散歩でたくさん歩きました。ごはんは完食。<br />お昼寝もぐっすりでした。</p>`,
        "mt-3",
      )}
      ${meter("detail")}`;
  }

  // ---------------------------------------------------------------
  // 画面: アルバム（一覧のコストが案ごとにどう違うか）
  // ---------------------------------------------------------------
  function screenAlbum() {
    const cells = ALBUM.map((p) => {
      let mark = "";
      if (state.plan === "C") {
        mark =
          p.where === "driveOnly"
            ? `<span class="absolute right-1 top-1 rounded bg-surface/90 px-1 text-[9px] font-medium text-primary">☁︎</span>`
            : p.where === "appOnly"
              ? `<span class="absolute right-1 top-1 rounded bg-surface/90 px-1 text-[9px] font-medium text-muted-foreground">端末</span>`
              : `<span class="absolute right-1 top-1 rounded bg-surface/90 px-1 text-[9px] font-medium text-muted-foreground">両</span>`;
      } else if (state.plan === "A" && p.where === "appOnly" && state.link === "linked") {
        mark = `<span class="absolute right-1 top-1 h-1.5 w-1.5 rounded-full bg-amber-500"></span>`;
      }
      return `<div class="relative">${photoBox(p.emoji)}${mark}</div>`;
    }).join("");

    const legend =
      state.plan === "C"
        ? note("案 C は写真ごとにバッジが必要になり、一覧がにぎやかになります。ドライブのみの写真はここでも通信が発生します。")
        : state.plan === "A"
          ? note("案 A の一覧はアプリのサムネだけ。未バックアップの写真に小さな点が付くだけで、通信は 0 です。")
          : note("案 B の一覧もアプリのサムネだけ。原本がドライブでも一覧は 0 通信で、スクロールしても増えません。");

    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">アルバム</h1>
      <p class="mb-4 text-sm text-muted-foreground">もふ ・ 24 枚</p>
      <div class="grid grid-cols-3 gap-2">${cells}</div>
      ${legend}
      ${meter("album")}`;
  }

  // ---------------------------------------------------------------
  // 画面: 記録フォーム（保存先を選ばせるか否か）
  // ---------------------------------------------------------------
  function screenForm() {
    let destination = "";
    if (state.plan === "C") {
      destination = `
        <div class="mt-4">
          <span class="mb-1 block text-sm font-medium text-foreground">写真の保存先</span>
          <div class="inline-flex rounded-lg border border-border p-0.5">
            <button type="button" data-dest="app" class="rounded-md px-3 py-1.5 text-sm font-medium transition ${off}">アプリ</button>
            <button type="button" data-dest="drive" class="rounded-md px-3 py-1.5 text-sm font-medium transition ${on}">ドライブ</button>
            <button type="button" data-dest="both" class="rounded-md px-3 py-1.5 text-sm font-medium transition ${off}">両方</button>
          </div>
          <label class="mt-2 flex items-center gap-2 text-xs text-muted-foreground">
            <input type="checkbox" checked class="h-4 w-4 rounded border-border" />次回もこの保存先を使う
          </label>
          ${note("⚠️ 実機で確かめたいのはここ。保存のたびにこの選択が要るのは、写真を残す手数として重すぎないか。")}
        </div>`;
    } else if (state.link === "linked") {
      destination = note(
        state.plan === "A"
          ? "保存後、バックグラウンドで Google ドライブにも控えを作ります（設定でオフにできます）。"
          : "原本は Google ドライブへ、表示用のサムネイルはアプリに保存します。",
      );
    } else {
      destination = note("写真はアプリに保存します。Google ドライブ連携は「ドライブ」タブから。");
    }

    return `
      <div class="mb-4 flex items-center justify-between">
        <button type="button" class="text-sm text-muted-foreground">キャンセル</button>
        <button type="button" class="rounded-lg bg-primary px-5 py-2 font-medium text-primary-foreground transition hover:bg-primary-hover">保存</button>
      </div>
      <div>
        <span class="mb-1 block text-sm font-medium text-foreground">記録元</span>
        <div class="inline-flex rounded-lg border border-border p-0.5">
          <button type="button" class="rounded-md px-4 py-1.5 text-sm font-medium transition ${on}">保育園</button>
          <button type="button" class="rounded-md px-4 py-1.5 text-sm font-medium transition ${off}">おうち</button>
        </div>
      </div>
      <div class="mt-4">
        <span class="mb-1 block text-sm font-medium text-foreground">写真を追加（複数選択可）</span>
        <div class="mb-2 grid grid-cols-2 gap-2">
          <button type="button" class="rounded-lg border border-border px-3 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">端末から選ぶ</button>
          <button type="button" class="rounded-lg border border-border px-3 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">Google フォトから選ぶ</button>
        </div>
        <div class="grid grid-cols-3 gap-2">
          ${photoBox("🐕")}${photoBox("🌳")}
          <div class="flex aspect-square items-center justify-center rounded-lg border border-dashed border-border text-2xl text-muted-foreground">＋</div>
        </div>
        <p class="mt-1.5 text-xs text-muted-foreground">2枚を最適化しました（4.8 MB → 640 KB / -87%）</p>
        ${note("「Google フォトから選ぶ」= Picker API。端末に無い写真（すでにフォトへバックアップ済みの写真）を記録に付けられる。選んだ瞬間にアプリ側へ取り込むので、以降フォトを叩き続けることはない。")}
        ${destination}
      </div>
      <div class="mt-4">
        <span class="mb-1 block text-sm font-medium text-foreground">保育園からの記録</span>
        <div class="h-28 w-full rounded-lg border border-border bg-surface"></div>
      </div>
      ${meter("form")}`;
  }

  // ---------------------------------------------------------------
  // 画面: ドライブ連携の設定
  // ---------------------------------------------------------------
  function screenSettings() {
    if (state.link === "none") {
      return `
        <h1 class="mb-4 text-lg font-semibold text-foreground">Google ドライブ</h1>
        ${card(`
          <p class="text-sm leading-relaxed text-foreground">写真を自分の Google ドライブにも残せます。</p>
          <ul class="mt-3 space-y-1.5 text-xs leading-relaxed text-muted-foreground">
            <li>・アプリが作ったファイルだけにアクセスします（<code class="rounded bg-surface-muted px-1">drive.file</code>）</li>
            <li>・ドライブの他のファイルは読みません</li>
            <li>・いつでも解除できます</li>
          </ul>
          <button type="button" class="mt-4 w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">Google ドライブと連携する</button>
        `)}
        ${meter("settings")}`;
    }

    const expired =
      state.link === "expired"
        ? card(
            `<p class="text-sm font-medium text-foreground">連携が切れています</p>
             <p class="mt-1 text-xs leading-relaxed text-muted-foreground">ドライブ側の原本はそのまま残っていますが、mfmf からは開けません。再連携すると元どおり見えるようになります。</p>
             <button type="button" class="mt-3 w-full rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">再連携する</button>`,
            "mb-3 border-amber-500/50",
          )
        : "";

    const scope =
      state.owner === "owner"
        ? `<p class="text-sm text-foreground">この世帯の原本は <strong class="font-medium">はなこさん（owner）のドライブ</strong> にまとめて入ります。</p>
           ${note("集約案。誰が入れても置き場所が 1 つなので家族から見て分かりやすい。ただし owner の 15GB を全員で使い、owner が抜けると全員が原本を失います。")}`
        : `<p class="text-sm text-foreground">写真を入れた人の <strong class="font-medium">それぞれのドライブ</strong> に入ります。</p>
           ${note("分散案。各自の 15GB を使えるが、「たろうさんが連携を切ると、たろうさんが入れた原本だけ見えなくなる」という説明が家族に要る。")}`;

    const progress =
      state.plan === "A"
        ? `<div class="mt-4">
             <div class="mb-1 flex items-baseline justify-between text-xs">
               <span class="font-medium text-foreground">バックアップの進み具合</span>
               <span class="text-muted-foreground">1,180 / 1,204 枚</span>
             </div>
             <div class="h-2 w-full overflow-hidden rounded-full bg-surface-muted">
               <div class="h-full w-[98%] rounded-full bg-primary"></div>
             </div>
             ${
               state.role === "editor"
                 ? `<button type="button" class="mt-3 w-full rounded-lg border border-border px-4 py-2 text-sm font-medium text-foreground transition hover:bg-surface-muted">残り 24 枚をバックアップ</button>`
                 : ""
             }
             ${note("一括バックアップは画面を開いている間だけ少しずつ進みます（Vercel Hobby にジョブ基盤が無いため）。閉じても途中から再開できます。")}
           </div>`
        : `<div class="mt-4 grid grid-cols-2 gap-2 text-center">
             <div class="rounded-lg border border-border p-3">
               <p class="text-[11px] text-muted-foreground">アプリ（サムネ）</p>
               <p class="mt-0.5 text-base font-semibold text-foreground">32 MB</p>
             </div>
             <div class="rounded-lg border border-border p-3">
               <p class="text-[11px] text-muted-foreground">ドライブ（原本）</p>
               <p class="mt-0.5 text-base font-semibold text-foreground">1.8 GB</p>
             </div>
           </div>
           ${note("原本をドライブに逃がすと Supabase Free（1GB）の枠がほぼ減りません。これが案 B の一番の利点です。")}`;

    return `
      <h1 class="mb-4 text-lg font-semibold text-foreground">Google ドライブ</h1>
      ${expired}
      ${card(`
        <div class="flex items-center gap-3">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-muted text-lg">☁️</span>
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-foreground">taro@example.com</p>
            <p class="text-xs text-muted-foreground">フォルダ: マイドライブ / mfmf</p>
          </div>
        </div>
        ${state.plan === "A" ? `<label class="mt-4 flex items-center justify-between gap-3 text-sm text-foreground">新しい写真を自動でバックアップ<input type="checkbox" checked class="h-5 w-9 rounded-full border-border" /></label>` : ""}
        ${progress}
      `)}
      ${card(scope, "mt-3")}
      ${card(
        `<div class="flex items-center justify-between gap-3">
           <p class="text-sm font-medium text-foreground">Google フォトにも追加する</p>
           <input type="checkbox" class="h-5 w-9 rounded-full border-border" />
         </div>
         <p class="mt-1.5 text-xs leading-relaxed text-muted-foreground">
           オンにすると、記録に付けた写真がフォトのライブラリにも入ります（思い出・検索に乗る）。
           <strong class="font-medium text-foreground">表示には使いません</strong> ——
           フォトの Library API は 10,000 リクエスト/日（プロジェクト全体）で、表示 URL も 60 分で失効するため。
         </p>
         ${note("⚠️ このトグルを入れると OAuth 検証（審査）が必要になります。drive.file だけなら不要。第 1 段では出さない案もあります。")}`,
        "mt-3",
      )}
      ${card(
        `<p class="text-sm font-medium text-foreground">連携を解除すると</p>
         <ul class="mt-2 space-y-1 text-xs leading-relaxed text-muted-foreground">
           <li>・ドライブ側のファイルは<strong class="font-medium text-foreground">消えません</strong>（mfmf からは開けなくなります）</li>
           ${state.plan === "B" ? `<li>・アプリにはサムネイルが残るので、一覧・詳細の見た目は変わりません</li>` : `<li>・アプリ側の原本はそのまま残るので、表示は何も変わりません</li>`}
         </ul>`,
        "mt-3",
      )}
      ${meter("settings")}`;
  }

  // ---------------------------------------------------------------
  // 画面: 4 状態の一覧（案ごとの振る舞いを俯瞰する）
  // ---------------------------------------------------------------
  const MATRIX = {
    A: [
      ["両方にある", "通常表示 ＋「ドライブにバックアップ済み」", "正常"],
      ["アプリだけ", "通常表示 ＋「バックアップ待ち」／未連携なら無表示", "正常（同期前）"],
      ["ドライブだけ", "起きない（アプリ側の原本を消さないため）", "—"],
      ["どちらにも無い", "原因つきの欠落カード ＋ 復旧導線", "異常"],
    ],
    B: [
      ["両方にある", "サムネ表示。「原本を表示」でドライブから取得", "正常"],
      ["アプリだけ", "通常表示 ＋「原本: アプリ内」。ゲスト・未連携の写真", "正常（移行前）"],
      ["ドライブだけ", "原本を縮小して表示（この 1 枚だけ通信）", "稀・要フォールバック"],
      ["どちらにも無い", "サムネは残るので写真は見える。原本だけ開けない", "劣化はするが致命的でない"],
    ],
    C: [
      ["両方にある", "通常表示 ＋「保存先: 両方」", "正常"],
      ["アプリだけ", "通常表示 ＋「保存先: アプリ」", "正常"],
      ["ドライブだけ", "都度ドライブから取得。連携が切れると即見えなくなる", "正常だが脆い"],
      ["どちらにも無い", "欠落カード。原因が写真ごとに違い説明が難しい", "異常"],
    ],
  };

  function screenMatrix() {
    const rows = MATRIX[state.plan]
      .map(
        ([s, view, verdict]) => `
        <div class="border-b border-border px-3 py-2.5 last:border-b-0">
          <div class="flex items-baseline justify-between gap-2">
            <p class="text-sm font-medium text-foreground">${s}</p>
            <span class="shrink-0 text-[11px] text-muted-foreground">${verdict}</span>
          </div>
          <p class="mt-0.5 text-xs leading-relaxed text-muted-foreground">${view}</p>
        </div>`,
      )
      .join("");

    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">4 つの状態と表示</h1>
      <p class="mb-4 text-sm text-muted-foreground">${PLAN[state.plan].name}</p>
      <div class="overflow-hidden rounded-xl border border-border bg-surface">${rows}</div>
      ${card(
        `<p class="text-sm font-medium text-foreground">「どちらにも無い」の文言が一番大事</p>
         <p class="mt-1.5 text-xs leading-relaxed text-muted-foreground">
           家族から見ると「アプリが写真を消した」に見えます。実際はドライブのゴミ箱・連携切れ・アップロード失敗のどれかで、
           それぞれ復旧の手が違います。原因を書き分けないと問い合わせがここに集中します。
         </p>`,
        "mt-3",
      )}`;
  }

  // ---------------------------------------------------------------
  // 描画
  // ---------------------------------------------------------------
  const SCREENS = {
    album: screenAlbum,
    detail: screenDetail,
    form: screenForm,
    settings: screenSettings,
    matrix: screenMatrix,
  };

  function render() {
    document.querySelectorAll("[data-plan]").forEach((b) => {
      b.className = `rounded-md px-2 py-1.5 text-xs font-medium transition ${b.dataset.plan === state.plan ? on : off}`;
    });
    document.querySelector("[data-plan-summary]").textContent = PLAN[state.plan].tagline;

    document.querySelectorAll("[data-screen-to]").forEach((b) => {
      const active = b.dataset.screenTo === state.screen;
      if (b.dataset.screenTo === "form") return;
      b.className = `flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition ${active ? "text-primary" : "text-muted-foreground"}`;
    });

    document.querySelector("[data-screen]").innerHTML = SCREENS[state.screen]();

    document.querySelector("[data-toggles]").innerHTML = TOGGLES.map(
      (t) => `
        <div>
          <span class="mb-1 block text-xs font-medium text-foreground">${t.label}</span>
          <div class="flex flex-wrap gap-1">
            ${t.options
              .map(
                ([v, label]) =>
                  `<button type="button" data-toggle="${t.key}" data-value="${v}" class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium transition ${state[t.key] === v ? on : off}">${label}</button>`,
              )
              .join("")}
          </div>
        </div>`,
    ).join("");
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-plan], [data-screen-to], [data-toggle], [data-open-settings], [data-close-settings]");
    if (!t) return;
    if (t.dataset.plan) state.plan = t.dataset.plan;
    else if (t.dataset.screenTo) state.screen = t.dataset.screenTo;
    else if (t.dataset.toggle) state[t.dataset.toggle] = t.dataset.value;
    else if (t.hasAttribute("data-open-settings")) {
      document.querySelector("[data-settings-panel]").classList.remove("hidden");
      return;
    } else if (t.hasAttribute("data-close-settings")) {
      document.querySelector("[data-settings-panel]").classList.add("hidden");
      return;
    }
    render();
  });

  render();
</script>
