<script>
// ====== 固定モックデータ（バックエンドへの経路は存在しない） ======
const SAMPLES = [
  { source: "daycare", body: "お昼はしっかり完食。お昼寝は 2 時間ぐっすりでした。", daysAgo: 0 },
  { source: "home", body: "夜ごはん完食、さんぽ 30 分。ごきげんでした。", daysAgo: 1 },
  { source: "daycare", body: "お友達と追いかけっこ。水はよく飲んでいました。", daysAgo: 1 },
  { source: "home", body: "おくすり済み。うんちは普通。", daysAgo: 2 },
  { source: "daycare", body: "ちょっと食欲少なめ。夕方には元気に。", daysAgo: 3 },
];
const CHIPS = [
  "ごはん完食",
  "ごはん少なめ",
  "おやつ",
  "さんぽ",
  "トイレOK",
  "おくすり",
  "ねんね",
  "ごきげん",
];

// ====== 状態 ======
let records = [];
let count = 5;
let variant = "A"; // A: チップ主体 / B: ひとこと主体
let viewer = false;
let source = "home";
let selectedChips = [];

const $ = (id) => document.getElementById(id);

function formatDate(d) {
  return new Intl.DateTimeFormat("ja-JP", {
    year: "numeric", month: "long", day: "numeric", weekday: "short",
  }).format(d);
}

function daysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return d;
}

function seedRecords() {
  records = [];
  for (let i = 0; i < count; i++) {
    const s = SAMPLES[i % SAMPLES.length];
    records.push({ source: s.source, body: s.body, date: daysAgo(s.daysAgo + Math.floor(i / SAMPLES.length)) });
  }
}

// ====== 一覧描画（本番のカードと同じクラス） ======
const PAW_SVG = '<svg class="h-8 w-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="4" r="2"/><circle cx="18" cy="8" r="2"/><circle cx="20" cy="16" r="2"/><path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/></svg>';

function badgeHtml(src) {
  const isHome = src === "home";
  const cls = isHome ? "bg-amber-100 text-amber-900" : "bg-sky-100 text-sky-900";
  const label = isHome ? "おうち" : "保育園";
  return '<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-medium ' + cls + '">' + label + "</span>";
}

function render() {
  const list = $("recordList");
  const empty = $("emptyState");
  const line = $("countLine");
  list.innerHTML = "";
  if (records.length === 0) {
    // viewer には出せない「＋ 新規」への誘導を出さない
    empty.innerHTML = viewer
      ? "まだ記録がありません。"
      : 'まだ記録がありません。<br />「＋ 新規」から最初の記録を追加しましょう。';
    empty.classList.remove("hidden");
    line.textContent = "";
  } else {
    empty.classList.add("hidden");
    line.textContent = "全 " + records.length + " 件";
    const frag = document.createDocumentFragment();
    for (const r of records) {
      const li = document.createElement("li");
      li.innerHTML =
        '<a href="#" class="flex gap-3 rounded-2xl bg-surface p-3 shadow-sm ring-1 ring-border transition hover:ring-border">' +
        '<div class="relative h-20 w-20 shrink-0 overflow-hidden rounded-xl bg-surface-muted">' +
        '<div class="flex h-full w-full items-center justify-center text-muted-foreground">' + PAW_SVG + "</div></div>" +
        '<div class="min-w-0 flex-1">' +
        '<div class="flex flex-wrap items-center gap-1.5">' + badgeHtml(r.source) + "</div>" +
        '<p class="mt-1 text-sm font-semibold text-foreground">' + formatDate(r.date) + "</p>" +
        '<p class="mt-0.5 text-sm text-muted-foreground"></p>' +
        "</div></a>";
      li.querySelector("p.mt-0\\.5").textContent = r.body.length > 80 ? r.body.slice(0, 80) + "…" : r.body;
      frag.appendChild(li);
    }
    list.appendChild(frag);
  }
  // viewer では書き込み導線を出さない（本番の readOnly と同じ）
  $("fab").style.display = viewer ? "none" : "";
  $("newFullBtn").style.display = viewer ? "none" : "";
}

// ====== シート ======
function chipClass(active) {
  return active
    ? "rounded-full bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition"
    : "rounded-full bg-surface-muted px-4 py-2 text-sm font-medium text-muted-foreground transition hover:bg-muted";
}

// チップは一度だけ生成し、トグルはその場でクラスを更新する
// （作り直すとフォーカス中のボタンが消え、キーボード操作が背景へ落ちる）
function renderChips() {
  const grid = $("chipGrid");
  grid.innerHTML = "";
  for (const chip of CHIPS) {
    const btn = document.createElement("button");
    const isActive = () => selectedChips.includes(chip);
    btn.className = chipClass(isActive());
    btn.setAttribute("aria-pressed", String(isActive()));
    btn.textContent = chip;
    btn.onclick = () => {
      selectedChips = isActive()
        ? selectedChips.filter((c) => c !== chip)
        : [...selectedChips, chip];
      btn.className = chipClass(isActive());
      btn.setAttribute("aria-pressed", String(isActive()));
      updatePreview();
    };
    grid.appendChild(btn);
  }
}

function composedBody() {
  const note = $("noteInput").value.trim();
  return [...selectedChips, note].filter(Boolean).join("、");
}

function updatePreview() {
  const body = composedBody();
  $("bodyPreview").textContent = body ? body : "チップを選ぶか、ひとことを書いてください";
  $("saveBtn").disabled = body === "";
}

function applyVariant() {
  // 案 A: テキストは「＋ ひとことを足す」の奥。案 B: 最初から出す＋自動フォーカス
  if (variant === "A") {
    $("noteRow").classList.add("hidden");
    $("noteOpenBtn").classList.remove("hidden");
    $("noteOpenBtn").classList.add("inline-flex");
  } else {
    $("noteRow").classList.remove("hidden");
    $("noteOpenBtn").classList.add("hidden");
    $("noteOpenBtn").classList.remove("inline-flex");
  }
}

let focusTimer = null;

function openSheet() {
  $("sheetDate").textContent = formatDate(new Date());
  applyVariant();
  $("pageRoot").inert = true; // 背景をフォーカス・支援技術から外す（Tab がシートから漏れない）
  $("sheet").inert = false;
  $("sheet").classList.remove("translate-y-full");
  $("backdrop").classList.remove("opacity-0", "pointer-events-none");
  updatePreview();
  // 開くアニメーション中に閉じられたら closeSheet 側でキャンセルする
  if (variant === "B") {
    focusTimer = setTimeout(() => $("noteInput").focus(), 300);
  } else {
    $("sheet").focus({ preventScroll: true }); // 案 A はダイアログ自体へ（IME を開かない）
  }
}

function closeSheet() {
  clearTimeout(focusTimer);
  focusTimer = null;
  $("sheet").inert = true;
  $("pageRoot").inert = false;
  $("sheet").classList.add("translate-y-full");
  $("backdrop").classList.add("opacity-0", "pointer-events-none");
  $("noteInput").blur();
  // モーダルを閉じたらフォーカスを開いた場所（FAB）へ戻す
  $("fab").focus({ preventScroll: true });
}

function setSource(src) {
  source = src;
  document.querySelectorAll(".source-btn").forEach((b) => {
    const on = b.dataset.source === source;
    b.setAttribute("aria-checked", String(on)); // 選択状態を支援技術へ通知
    b.classList.toggle("ring-2", on);
    b.classList.toggle("ring-0", !on);
    b.classList.toggle("ring-amber-400", on && b.dataset.source === "home");
    b.classList.toggle("ring-sky-400", on && b.dataset.source === "daycare");
  });
}

function resetSheet() {
  selectedChips = [];
  $("noteInput").value = "";
  setSource("home"); // 既定はおうち（notes.md の仮置き）に毎回戻す
  renderChips();
  updatePreview();
}

// ====== イベント ======
$("fab").onclick = openSheet;
$("backdrop").onclick = closeSheet;
$("sheetCloseBtn").onclick = closeSheet;
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("sheet").inert) closeSheet();
});

$("noteOpenBtn").onclick = () => {
  $("noteRow").classList.remove("hidden");
  $("noteOpenBtn").classList.add("hidden");
  $("noteOpenBtn").classList.remove("inline-flex");
  $("noteInput").focus();
};
$("noteInput").oninput = updatePreview;

document.querySelectorAll(".source-btn").forEach((btn) => {
  btn.onclick = () => setSource(btn.dataset.source);
});

let toastTimer = null;

$("saveBtn").onclick = () => {
  const body = composedBody();
  if (!body) return;
  records.unshift({ source, body, date: new Date() });
  render();
  closeSheet();
  resetSheet();
  // role=status のリージョンにテキストを入れた時点で読み上げられる
  const toast = $("toast");
  clearTimeout(toastTimer);
  toast.textContent = "残しました";
  toast.classList.remove("opacity-0");
  toastTimer = setTimeout(() => {
    toast.classList.add("opacity-0");
    toast.textContent = "";
  }, 1800);
  window.scrollTo({ top: 0, behavior: "smooth" });
};

// ====== デバッグバー（プロト専用） ======
document.querySelectorAll(".count-btn").forEach((btn) => {
  btn.onclick = () => {
    count = Number(btn.dataset.count);
    document.querySelectorAll(".count-btn").forEach((b) => {
      const on = b === btn;
      b.classList.toggle("bg-primary", on);
      b.classList.toggle("text-primary-foreground", on);
      b.classList.toggle("bg-surface", !on);
    });
    seedRecords();
    render();
  };
});

document.querySelectorAll(".variant-btn").forEach((btn) => {
  btn.onclick = () => {
    variant = btn.dataset.variant;
    document.querySelectorAll(".variant-btn").forEach((b) => {
      const on = b === btn;
      b.classList.toggle("bg-primary", on);
      b.classList.toggle("text-primary-foreground", on);
      b.classList.toggle("bg-surface", !on);
    });
    applyVariant();
  };
});

$("viewerToggle").onchange = (e) => {
  viewer = e.target.checked;
  render();
};

// ====== 初期化 ======
seedRecords();
renderChips();
render();
updatePreview();
</script>
