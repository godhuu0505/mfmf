name: Inspect Supabase Auth URLs

# One read-only GET. No restore, settings update, migration, or deployment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-auth-url-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read sanitized site and redirect URL metadata
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: node scripts/inspect-supabase-auth-urls.mjs
