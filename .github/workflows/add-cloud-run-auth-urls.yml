name: Add Cloud Run Auth URLs

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Append the two fixed candidate callbacks (false only plans)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-auth-url-update
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan or append fixed Cloud Run callbacks
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_AUTH_URLS_APPLY: ${{ inputs.apply && 'true' || 'false' }}
        run: node scripts/add-cloud-run-auth-urls.mjs
