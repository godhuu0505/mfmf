      <button

        data-open-settings
        class="rounded-md px-2 py-0.5 text-xs font-medium text-primary transition hover:bg-surface-muted"
      >
        プロト設定
      </button>
    </div>
  </div>

  <main class="mx-auto max-w-md px-4 pt-4 pb-32" data-screen></main>

  <!-- ============ ボトムタブバー（D33） ============ -->
  <nav data-app-tabbar class="fixed inset-x-0 bottom-0 z-20 border-t border-border bg-surface/95 backdrop-blur">
    <div
      class="mx-auto grid max-w-md grid-cols-5 items-end px-2 pt-1.5"
      style="padding-bottom: max(0.375rem, env(safe-area-inset-bottom))"

      <button type="button" data-screen-to="album" class="flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition">
        <span class="text-lg leading-none">🖼</span><span>アルバム</span>
      </button>
      <button type="button" data-screen-to="detail" class="flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition">
        <span class="text-lg leading-none">📄</span><span>記録詳細</span>
      </button>
      <button type="button" data-screen-to="intro" class="flex flex-col items-center justify-center">

      </button>
      <button type="button" data-screen-to="backup" class="flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition">
        <span class="text-lg leading-none">📦</span><span>バックアップ</span>
      </button>
      <button type="button" data-screen-to="menu" class="flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition">

  <!-- ============ プロト設定 ============ -->

        <h2 class="text-base font-semibold text-foreground">プロト設定</h2>
        <button type="button" data-close-settings class="rounded-md px-2 py-1 text-sm text-muted-foreground transition hover:bg-surface-muted">閉じる</button>
      </div>
      <p class="mb-4 text-xs leading-relaxed text-muted-foreground">
        実データ・実 API は使っていません（固定データのみ）。<br />
        中央の ☁️ は「連携の説明」画面です。

<script>
  // ---------------------------------------------------------------
  // 状態（すべて固定データ。fetch は書かない）
  // ---------------------------------------------------------------
  const state = {
    screen: "backup",
    status: "done", // none / fresh / running / done / partial / expired / full
    badge: "quiet", // quiet: 済みを出さない / show: 済みを出す
    storage: "low", // low: 42% / high: 78%（案 B への案内が出る）
    role: "editor", // editor / viewer
    hint: true, // アルバムの案内カードを出すか
    progress: 742,
  };

  const TOTAL = 1204;

  const TOGGLES = [
    {
      key: "status",
      label: "バックアップの状態",
      options: [
        ["none", "未連携"],
        ["fresh", "連携直後"],
        ["running", "実行中"],
        ["done", "すべて済み"],
        ["partial", "一部が失敗"],
        ["expired", "連携が切れた"],
        ["full", "ドライブ容量不足"],
      ],
    },
    {
      key: "badge",
      label: "記録詳細に「済み」を出すか（← 実機で比べたい）",
      options: [
        ["quiet", "出さない（推し）"],
        ["show", "出す"],
      ],
    },
    {
      key: "storage",
      label: "アプリの空き容量",
      options: [
        ["low", "42%（案内なし）"],
        ["high", "78%（案 B の案内が出る）"],
      ],
    },
    {
      key: "role",
      label: "権限",
      options: [
        ["editor", "owner / editor"],
        ["viewer", "viewer（機能を出さない）"],
      ],
    },
    {
      key: "hint",
      label: "アルバムの初回案内カード",
      options: [
        [true, "出す"],
        [false, "dismiss 済み"],
      ],
    },
  ];

  // ---------------------------------------------------------------
  // 部品
  // ---------------------------------------------------------------
  const on = "bg-primary text-primary-foreground";
  const off = "text-muted-foreground hover:bg-surface-muted";

  function card(inner, extra = "") {
    return `<section class="rounded-xl border border-border bg-surface p-4 ${extra}">${inner}</section>`;
  }
  function warnCard(inner, extra = "") {
    return card(inner, `border-amber-500/50 ${extra}`);
  }
  function photoBox(emoji, extra = "") {
    return `<div class="flex aspect-square items-center justify-center rounded-lg bg-surface-muted text-3xl ${extra}">${emoji}</div>`;
  }
  function primaryBtn(label) {
    return `<button type="button" class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">${label}</button>`;
  }
  function plainBtn(label) {
    return `<button type="button" class="w-full rounded-lg border border-border px-4 py-2.5 text-sm font-medium text-foreground transition hover:bg-surface-muted">${label}</button>`;
  }
  function toggleRow(label, checked) {
    return `<label class="flex items-center justify-between gap-3 text-sm text-foreground">${label}<input type="checkbox" ${checked ? "checked" : ""} class="h-5 w-9 rounded-full border-border" /></label>`;
  }
  function note(text) {
    return `<p class="mt-2 text-xs leading-relaxed text-muted-foreground">${text}</p>`;
  }
  // 異常表示に必ず添える一文（判断 9）
  function safeLine(text) {
    return `<p class="mt-2 rounded-lg bg-surface-muted/70 px-3 py-2 text-xs leading-relaxed text-foreground">${text}</p>`;
  }

  // メニュー・タブに出す一行サマリ
  function statusLine() {
    switch (state.status) {
      case "none":
        return ["未設定", "muted"];
      case "fresh":
        return [`${TOTAL.toLocaleString()} 枚が未バックアップ`, "warn"];
      case "running":
        return [`バックアップ中 ${state.progress.toLocaleString()} / ${TOTAL.toLocaleString()}`, "primary"];
      case "done":
        return ["すべてバックアップ済み", "muted"];
      case "partial":
        return ["12 枚がバックアップできていません", "warn"];
      case "expired":
        return ["連携が切れています", "warn"];
      case "full":
        return ["ドライブの空き容量が足りません", "warn"];
    }
  }

  // ---------------------------------------------------------------
  // 画面: アルバム（発見 / 判断 1・6）
  // ---------------------------------------------------------------
  function screenAlbum() {
    const emojis = ["🐕", "🦴", "🐾", "🍚", "🌳", "🛁"];
    const cells = Array.from({ length: 18 }, (_, i) => photoBox(emojis[i % 6])).join("");

    const hint =
      state.hint && state.role === "editor" && state.status === "none"
        ? card(
            `<p class="text-sm font-medium text-foreground">☁️ 写真をドライブにも残せます</p>
             <p class="mt-1 text-xs leading-relaxed text-muted-foreground">万一のときのために、あなたが追加した写真の控えを Google ドライブに作れます。</p>
             <div class="mt-3 flex gap-2">
               <button type="button" data-screen-to="intro" class="flex-1 rounded-lg bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">設定する</button>
               <button type="button" data-dismiss-hint class="flex-1 rounded-lg border border-border px-4 py-2 text-sm font-medium text-muted-foreground transition hover:bg-surface-muted">あとで</button>
             </div>`,
            "mb-4",
          )
        : "";

    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">アルバム</h1>
      <p class="mb-4 text-sm text-muted-foreground">もふ ・ 1,204 枚</p>
      ${hint}
      <div class="grid grid-cols-3 gap-2">${cells}</div>
      ${note("一覧にはバックアップの状態を<strong class=\"font-medium text-foreground\">一切出さない</strong>（判断 1: 正常は無音）。ここに ☁️ が並ぶと、写真を見る画面がバックアップの管理画面になってしまう。")}`;
  }

  // ---------------------------------------------------------------
  // 画面: 連携の説明（信頼の入口 / 判断 3）
  // ---------------------------------------------------------------
  function screenIntro() {
    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">Google ドライブにバックアップ</h1>
      <p class="mb-4 text-sm leading-relaxed text-muted-foreground">写真の控えを、あなたの Google ドライブに作ります。</p>
      ${card(`
        <ul class="space-y-3">
          <li>
            <p class="text-sm font-medium text-foreground">✓ アプリの写真はそのままです</p>
            <p class="mt-0.5 text-xs leading-relaxed text-muted-foreground">表示も編集も今までどおり。バックアップを切っても何も変わりません。</p>
          </li>
          <li>
            <p class="text-sm font-medium text-foreground">✓ 触れるのは mfmf が作ったファイルだけ</p>
            <p class="mt-0.5 text-xs leading-relaxed text-muted-foreground">ドライブにある他のファイルは読みません。</p>
          </li>
          <li>
            <p class="text-sm font-medium text-foreground">✓ いつでも解除できます</p>
            <p class="mt-0.5 text-xs leading-relaxed text-muted-foreground">解除しても、ドライブに保存済みの写真は消えません。</p>
          </li>
        </ul>
      `)}
      ${card(
        `<p class="text-sm font-medium text-foreground">バックアップされる写真</p>
         <p class="mt-1 text-xs leading-relaxed text-muted-foreground">
           <strong class="font-medium text-foreground">あなたが追加した写真</strong>だけです。
           家族が追加した写真は、その人が連携したときにその人のドライブへ入ります。
         </p>`,
        "mt-3",
      )}
      <div class="mt-4">${primaryBtn("Google ドライブと連携する")}</div>
      ${note("判断 3: 「世帯すべてを自分のドライブへ」は却下。他人の写真が自分のドライブに現れるのは驚きで、容量・退出時の扱いの説明も増える。")}`;
  }

  // ---------------------------------------------------------------
  // 画面: バックアップ（状態の集約）
  // ---------------------------------------------------------------
  function screenBackup() {
    if (state.role === "viewer") {
      return `
        <h1 class="mb-4 text-lg font-semibold text-foreground">写真のバックアップ</h1>
        ${card(`
          <p class="text-sm font-medium text-foreground">この機能は使えません</p>
          <p class="mt-1 text-xs leading-relaxed text-muted-foreground">閲覧のみの権限では、世帯の写真を個人のドライブへ複製できません。</p>
        `)}
        ${note("判断 7: viewer には項目自体をメニューにも出さない。ここはプロトで直接開いた場合の表示。")}`;
    }

    // --- 未連携 ---
    if (state.status === "none") {
      return `
        <h1 class="mb-4 text-lg font-semibold text-foreground">写真のバックアップ</h1>
        ${card(`
          <p class="text-sm leading-relaxed text-foreground">写真の控えを Google ドライブに作れます。</p>
          <p class="mt-1 text-xs leading-relaxed text-muted-foreground">今は控えを作っていません。アプリの中には保存されています。</p>
          <div class="mt-4"><button type="button" data-screen-to="intro" class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-medium text-primary-foreground transition hover:bg-primary-hover">設定を見る</button></div>
        `)}
        ${storageCard()}`;
    }

    const account = card(`
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-surface-muted text-lg">☁️</span>
        <div class="min-w-0">
          <p class="truncate text-sm font-medium text-foreground">taro@example.com</p>
          <p class="text-xs text-muted-foreground">マイドライブ ▸ mfmf</p>
        </div>
      </div>
    `);

    let body = "";

    // --- 連携直後（初回の一括を促す） ---
    if (state.status === "fresh") {
      body = card(
        `<p class="text-sm font-medium text-foreground">これまでの写真 ${TOTAL.toLocaleString()} 枚</p>
         <p class="mt-1 text-xs leading-relaxed text-muted-foreground">まだ控えを作っていません。</p>
         <div class="mt-3">${primaryBtn("今すぐバックアップする")}</div>
         <div class="mt-3 rounded-lg bg-surface-muted/70 px-3 py-2.5">
           <p class="text-xs font-medium text-foreground">時間がかかります（約 480MB）</p>
           <p class="mt-1 text-xs leading-relaxed text-muted-foreground">
             アプリを開いている間に少しずつ進みます。<br />
             途中でやめても、<strong class="font-medium text-foreground">次に開いたとき続きから再開</strong>します。
           </p>
         </div>`,
        "mt-3",
      );
    }

    // --- 実行中 ---
    else if (state.status === "running") {
      const pct = Math.round((state.progress / TOTAL) * 100);
      body = card(
        `<p class="text-sm font-medium text-foreground">バックアップ中</p>
         <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-surface-muted">
           <div data-progress-bar class="h-full rounded-full bg-primary transition-all" style="width: ${pct}%"></div>
         </div>
         <p class="mt-1.5 text-xs text-muted-foreground"><span data-progress-count class="font-medium text-foreground">${state.progress.toLocaleString()}</span> / ${TOTAL.toLocaleString()} 枚</p>
         <p class="mt-3 text-xs leading-relaxed text-muted-foreground">
           このページを開いたままにしてください。<br />
           閉じても、次に開いたとき続きから再開します。
         </p>
         <div class="mt-3">${plainBtn("一時停止")}</div>`,
        "mt-3",
      );
    }

    // --- 平常（すべて済み） ---
    else if (state.status === "done") {
      body = card(
        `<div class="flex items-baseline justify-between gap-2">
           <p class="text-sm font-medium text-foreground">すべてバックアップ済み</p>
           <span class="text-lg leading-none">✓</span>
         </div>
         <p class="mt-1 text-xs text-muted-foreground">${TOTAL.toLocaleString()} 枚 ・ 最終 8月5日 14:32</p>
         <div class="mt-4 border-t border-border pt-3">
           ${toggleRow("新しい写真を自動でバックアップ", true)}
         </div>
         <div class="mt-3">${plainBtn("ドライブのフォルダを開く")}</div>`,
        "mt-3",
      );
    }

    // --- 一部が失敗 ---
    else if (state.status === "partial") {
      body = warnCard(
        `<p class="text-sm font-medium text-foreground">12 枚がバックアップできませんでした</p>
         <p class="mt-1 text-xs leading-relaxed text-muted-foreground">しばらく時間をおいてからお試しください。</p>
         ${safeLine("アプリの写真は無事です。控えだけが作れていません。")}
         <div class="mt-3">${primaryBtn("もう一度試す")}</div>`,
        "mt-3",
      );
    }

    // --- 連携が切れた ---
    else if (state.status === "expired") {
      body = warnCard(
        `<p class="text-sm font-medium text-foreground">連携が切れています</p>
         <p class="mt-1 text-xs leading-relaxed text-muted-foreground">新しい写真の控えが作られていません。</p>
         ${safeLine("ドライブに保存済みの写真は残っています。アプリの表示にも影響はありません。")}
         <div class="mt-3">${primaryBtn("再連携する")}</div>`,
        "mt-3",
      );
    }

    // --- ドライブの容量不足 ---
    else if (state.status === "full") {
      body = warnCard(
        `<p class="text-sm font-medium text-foreground">Google ドライブの空き容量が足りません</p>
         <p class="mt-1 text-xs leading-relaxed text-muted-foreground">340 枚の控えが作れていません。</p>
         ${safeLine("アプリの中の写真はすべて無事です。表示にも影響はありません。")}
         <div class="mt-3">${plainBtn("ドライブの容量を確認する")}</div>`,
        "mt-3",
      );
    }

    const disconnect = `<div class="mt-3"><button type="button" data-screen-to="disconnect" class="w-full rounded-lg px-4 py-2.5 text-sm font-medium text-muted-foreground transition hover:bg-surface-muted">連携を解除する</button></div>`;

    return `
      <h1 class="mb-4 text-lg font-semibold text-foreground">写真のバックアップ</h1>
      ${account}
      ${body}
      ${storageCard()}
      ${disconnect}`;
  }

  // アプリの空き容量（判断 10: 案 B への布石）
  function storageCard() {
    const high = state.storage === "high";
    const pct = high ? 78 : 42;
    const used = high ? "780 MB" : "420 MB";
    return card(
      `<div class="mb-1 flex items-baseline justify-between text-xs">
         <span class="font-medium text-foreground">アプリの空き容量</span>
         <span class="text-muted-foreground">${used} / 1 GB</span>
       </div>
       <div class="h-2 w-full overflow-hidden rounded-full bg-surface-muted">
         <div class="h-full rounded-full ${high ? "bg-amber-500" : "bg-primary"}" style="width: ${pct}%"></div>
       </div>
       ${
         high
           ? `<p class="mt-2 text-xs leading-relaxed text-muted-foreground">写真が増えてきました。原本をドライブへ移してアプリの容量を空けることもできます。<button type="button" class="ml-1 font-medium text-primary underline">くわしく</button></p>`
           : ""
       }`,
      "mt-3",
    ) + note(high
      ? "6 割を超えたのでここに案内が出る（＝ 案 B へ進む判断のトリガー）。壁を突然にしないための表示。"
      : "6 割未満では案内を出さない。今は関係ない情報を出さない。");
  }

  // ---------------------------------------------------------------
  // 画面: 記録詳細（写真ごとの状態 / 判断 1）
  // ---------------------------------------------------------------
  function screenDetail() {
    let mark = "";
    if (state.status === "running" || state.status === "fresh") {
      mark = `<p class="mt-2 text-xs text-muted-foreground">バックアップ待ち</p>`;
    } else if (state.status === "partial") {
      mark = `<div class="mt-2 flex items-center justify-between gap-2">
                <p class="text-xs text-amber-700 dark:text-amber-400">バックアップできませんでした</p>
                <button type="button" class="rounded-md border border-border px-2 py-1 text-xs font-medium text-foreground transition hover:bg-surface-muted">再試行</button>
              </div>`;
    } else if (state.status === "done" && state.badge === "show") {
      mark = `<p class="mt-2 text-xs text-muted-foreground">☁︎ バックアップ済み</p>`;
    }

    return `
      <h1 class="mb-1 text-lg font-semibold text-foreground">2026年8月4日（火）</h1>
      <p class="mb-4 text-sm text-muted-foreground">保育園 ・ 記入: たろう</p>
      ${card(`
        <div class="grid grid-cols-2 gap-2">${photoBox("🐕")}${photoBox("🌳")}</div>
        ${mark}
      `)}
      ${card(`<p class="text-sm leading-relaxed text-foreground">今日はお散歩でたくさん歩きました。ごはんは完食。<br />お昼寝もぐっすりでした。</p>`, "mt-3")}
      ${note(
        state.status === "done"
          ? `プロト設定の「記録詳細に『済み』を出すか」で切り替えられます。<strong class="font-medium text-foreground">出さない</strong>を推していますが、「本当に控えができてる？」という不安が勝つなら出す —— これは実機で決めたい 1 点です。`
          : `異常・未処理のときだけ出す。ここでも技術用語（エラー・トークン）は使わない。`,
      )}`;
  }

  // ---------------------------------------------------------------
  // 画面: メニュー（導線 / 判断 5）
  // ---------------------------------------------------------------
  function screenMenu() {
    const [text, tone] = statusLine();
    const toneCls =
      tone === "warn" ? "text-amber-700 dark:text-amber-400" : tone === "primary" ? "text-primary" : "text-muted-foreground";

    const rows = [
      ["プロフィール", ""],
      ["ペット / 体重の推移", ""],
      ...(state.role === "editor" ? [["写真のバックアップ", text]] : []),
      ["世帯の設定", ""],
      ["使い方ガイド / ご意見", ""],
    ];

    return `
      <h1 class="mb-4 text-lg font-semibold text-foreground">メニュー</h1>
      <div class="overflow-hidden rounded-xl border border-border bg-surface">
        ${rows
          .map(
            ([label, sub]) => `
          <button type="button" ${label === "写真のバックアップ" ? 'data-screen-to="backup"' : ""} class="flex w-full items-center justify-between gap-3 border-b border-border px-4 py-3 text-left transition last:border-b-0 hover:bg-surface-muted">
            <span class="text-sm text-foreground">${label}</span>
            <span class="flex items-center gap-1.5">
              ${sub ? `<span class="text-xs ${toneCls}">${sub}</span>` : ""}
              <span class="text-muted-foreground">›</span>
            </span>
          </button>`,
          )
          .join("")}
      </div>
      ${note(
        state.role === "viewer"
          ? "viewer には項目自体を出さない（判断 7）。"
          : "メニュー直下 1 階層に置き、<strong class=\"font-medium text-foreground\">右側に現在の状態</strong>を出す。開かなくても分かるので、日常画面を静かにできる（判断 1・5）。",
      )}`;
  }

  // ---------------------------------------------------------------
  // 画面: 解除の確認
  // ---------------------------------------------------------------
  function screenDisconnect() {
    return `
      <h1 class="mb-4 text-lg font-semibold text-foreground">連携を解除しますか？</h1>
      ${card(`
        <ul class="space-y-2 text-sm leading-relaxed text-foreground">
          <li>・ドライブに保存済みの写真は<strong class="font-medium">消えません</strong></li>
          <li>・アプリの写真・表示は<strong class="font-medium">何も変わりません</strong></li>
          <li>・新しい写真の控えは作られなくなります</li>
        </ul>
      `)}
      <div class="mt-4 space-y-2">
        ${plainBtn("解除する")}
        <button type="button" data-screen-to="backup" class="w-full rounded-lg px-4 py-2.5 text-sm font-medium text-muted-foreground transition hover:bg-surface-muted">やめる</button>
      </div>
      ${note("「何が起きるか」より<strong class=\"font-medium text-foreground\">「何が起きないか」</strong>を先に書く。案 A は解除しても表示が変わらないのが最大の強みなので、それを解除画面で言う。")}`;
  }

  // ---------------------------------------------------------------
  // 描画
  // ---------------------------------------------------------------
  const SCREENS = {
    album: screenAlbum,
    intro: screenIntro,
    backup: screenBackup,
    detail: screenDetail,
    menu: screenMenu,
    disconnect: screenDisconnect,
  };

  let timer = null;

  function render() {
    document.querySelectorAll("[data-screen-to]").forEach((b) => {
      if (b.dataset.screenTo === "intro" && b.closest("[data-app-tabbar]")) return;
      if (!b.closest("[data-app-tabbar]")) return;
      const active = b.dataset.screenTo === state.screen;
      b.className = `flex flex-col items-center gap-0.5 py-1 text-[10px] font-medium transition ${active ? "text-primary" : "text-muted-foreground"}`;
    });

    document.querySelector("[data-screen]").innerHTML = SCREENS[state.screen]();

    document.querySelector("[data-toggles]").innerHTML = TOGGLES.map(
      (t) => `
        <div>
          <span class="mb-1 block text-xs font-medium text-foreground">${t.label}</span>
          <div class="flex flex-wrap gap-1">
            ${t.options
              .map(
                ([v, label]) =>
                  `<button type="button" data-toggle="${t.key}" data-value="${v}" class="rounded-lg border border-border px-3 py-1.5 text-xs font-medium transition ${String(state[t.key]) === String(v) ? on : off}">${label}</button>`,
              )
              .join("")}
          </div>
        </div>`,
    ).join("");

    // 実行中は進捗を実際に動かす（実機で「進んでいる感じ」を確かめるため）
    if (timer) clearInterval(timer);
    if (state.screen === "backup" && state.status === "running" && state.role === "editor") {
      timer = setInterval(() => {
        state.progress = Math.min(TOTAL, state.progress + 7);
        const bar = document.querySelector("[data-progress-bar]");
        const count = document.querySelector("[data-progress-count]");
        if (!bar || !count) return clearInterval(timer);
        bar.style.width = `${Math.round((state.progress / TOTAL) * 100)}%`;
        count.textContent = state.progress.toLocaleString();
        if (state.progress >= TOTAL) {
          clearInterval(timer);
          state.status = "done";
          render();
        }
      }, 600);
    }
  }

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-screen-to], [data-toggle], [data-dismiss-hint], [data-open-settings], [data-close-settings]");
    if (!t) return;
    if (t.hasAttribute("data-open-settings")) {
      document.querySelector("[data-settings-panel]").classList.remove("hidden");
      return;
    }
    if (t.hasAttribute("data-close-settings")) {
      document.querySelector("[data-settings-panel]").classList.add("hidden");
      return;
    }
    if (t.dataset.screenTo) state.screen = t.dataset.screenTo;
    else if (t.hasAttribute("data-dismiss-hint")) state.hint = false;
    else if (t.dataset.toggle) {
      const v = t.dataset.value;
      state[t.dataset.toggle] = v === "true" ? true : v === "false" ? false : v;
      if (t.dataset.toggle === "status" && v === "running") state.progress = 742;
    }
    render();
  });

  render();
</script>
